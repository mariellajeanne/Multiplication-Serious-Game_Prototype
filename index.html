function pace(){return data.options.motion!==false}function serial(){return Math.random().toString(36).slice(2,7).toUpperCase()}
function note(kind){if(!data.options.sfx)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended') audio.resume();let tones={tap:[375],link:[420,610],stamp:[530,750],place:[490,660],carry:[440,640,810],complete:[520,660,860],cash:[470,630,780,1030],bad:[170],gold:[580,760,960]}[kind]||[500];tones.forEach((hz,i)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.055;o.type=kind==='stamp'?'triangle':'sine';o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,data.options.sfx*.07),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.145);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.15)})}catch(e){}}
function musicStart(){if(musicTimer)clearInterval(musicTimer);if(!data.options.music)return;let i=0;const tune=[392,440,493.88,440,349.23,392,440,329.63];musicTimer=setInterval(()=>{if(!data.options.music||document.hidden)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=tune[(i++)%tune.length];g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.018*data.options.music,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+.48);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.49)}catch(e){}},660)}
function toast(title,text='',gold=false){let el=document.createElement('div');el.className='toast'+(gold?' golden':'');el.innerHTML=`<b>${title}</b>${text}`;$('toastArea').append(el);if($('toastArea').children.length>3)$('toastArea').firstElementChild.remove();setTimeout(()=>el.remove(),4800);if(gold)note('gold')}
function findWeak(){return skills.slice().sort((a,b)=>{let x=data.mastery[a],y=data.mastery[b];let ax=(x.ok+2)/(x.ok+x.bad+4),ay=(y.ok+2)/(y.ok+y.bad+4);return ax-ay})[0]}
function difficultBonus(a,b){let n=rev(a).length,m=rev(b).length,carry=carryCount(a,b);return{pairs:n*m,carry:carry.mult,add:carry.add,rows:m,digits:n,m,score:n*m+carry.mult*.7+Math.max(0,m-1)*2+carry.add*.6}}
function carryCount(a,b){const A=rev(a),B=rev(b);let mult=0, rows=[];B.forEach((digit,r)=>{let prev=0;for(let k=0;k<A.length;k++){let product=A[k]*digit+prev;prev=k===A.length-1?0:Math.floor(product/10);if(prev)mult++}rows.push(a*digit*(10**r))});let max=String(a*b).length,sumC=0,carry=0;for(let c=0;c<max;c++){let total=carry+rows.reduce((z,x)=>z+Math.floor(x/10**c)%10,0);carry=Math.floor(total/10);if(carry)sumC++}return{mult,add:sumC}}
function pickProblem(level,recommend=false){let group=pool[clamp(level,0,4)],choice=group[Math.floor(Math.random()*group.length)];let [a,b]=choice;if(!recommend && Math.random()<.25 && String(a).length===String(b).length)[a,b]=[b,a];return[a,b]}
function newTicket(level,golden=false,recommend=false){
 if(recommend){let weak=findWeak();if(['shift','addition'].includes(weak))level=Math.max(1,level);
   let possibilities=pool[level].filter(([a,b])=>{
     if(weak==='carry')return carryCount(a,b).mult>0;
     if(weak==='shift')return String(b).length>1;
     if(weak==='addition')return String(b).length>1&&carryCount(a,b).add>0;
     if(weak==='position')return String(a).length>=2;
     return true;
   });
   var chosen=possibilities.length?possibilities[Math.floor(Math.random()*possibilities.length)]:pickProblem(level,true);
   var [a,b]=chosen;
 }else{var [a,b]=pickProblem(level,false)}
 let grade=gradeNames[level];return{id:'T'+(data.nextTicket++),a,b,grade,level,golden,recommended:recommend,stars:level+1,descriptor:golden?`Golden Practice · ${findWeak()}`:['Neighborhood café','Brunch delivery','Hotel catering','City celebration','Royal bakery festival'][level],created:Date.now()}}
function refreshTickets(isInitial=false){let count=4+data.display,levelMax=Math.min(4,Math.max(2,Math.floor((data.completed+1)/2)+1+data.delivery));let list=[];for(let i=0;i<count;i++){let lvl=i===0?0:i===count-1?levelMax:clamp(Math.floor(Math.random()*(levelMax+1)+.25+data.display*.16+data.delivery*.10),0,levelMax);list.push(newTicket(lvl))}
 let chance=Math.min(.50,.14+data.delivery*.075+data.display*.025);let gold=Math.random()<chance||isInitial&&data.completed===0;
 if(gold){let lvl=clamp(Math.floor((data.completed+1)/2),0,4);list[Math.min(1,list.length-1)]=newTicket(lvl,true,true)}
 data.tickets=list;data.refreshAt=Date.now()+180000;save();if(!isInitial&&gold)toast('✨ Golden Ticket arrived!','Recommended for your current skill level. Open Order Tickets to claim it.',true);if(!isInitial&&!gold)toast('Fresh orders available','The bakery noticeboard has been updated.');}
function multiplier(t){return grades[t.level]*(t.golden?1.5:1)}
function efficientFactors(t){return String(t.a).length>=String(t.b).length?[t.a,t.b]:[t.b,t.a]}
function baseSpeed(t){let dif=difficultBonus(...efficientFactors(t));return 5+2*dif.pairs+dif.carry+2*Math.max(0,dif.rows-1)+dif.add}
function actualRate(p){return p.baseRate*(1+.2*(p.gear||0))}
function actualPrice(p){return p.price*(1+.05*data.display+.05*data.delivery)}

 <div class="rowstat"><span>Best Row Combo bonus</span><strong>×${(1+.05*w.bestRow).toFixed(2)}</strong></div>
 <div class="rowstat"><span>Accuracy (so far)</span><strong>×${Math.max(.8,1-.04*w.errors).toFixed(2)}</strong></div>
 <div class="rowstat"><span>Efficient setup</span><strong>×${String(w.a).length>=String(w.b).length?'1.00':'0.90'}</strong></div>
 <div class="rowstat"><span>Base coins per pack × rarity</span><strong>4 × ${multiplier(t).toFixed(2)}</strong></div>
 <p class="smallnote">Actual certified speed also includes a small tempo factor (×1.00–1.08).</p>
 <p class="smallnote">Accurate full Packing Cycles build the Row Combo. Lookup mistakes do not break it. Manual final addition remains required.</p></section></aside></div>`;
 if(window._paper) main.classList.add('paper-mode');else main.classList.remove('paper-mode')}
function showSettings(){showModal(`<div class="eyebrow">YOUR BAKERY</div><h2>⚙ Settings</h2><div class="settings-grid"><div class="setting-row"><label for="settingSfx">Sound effects</label><input id="settingSfx" type="range" min="0" max="1" step=".05" value="${data.options.sfx}"></div><div class="setting-row"><label for="settingMusic">Music</label><input id="settingMusic" type="range" min="0" max="1" step=".05" value="${data.options.music}"></div><div class="setting-row"><label for="settingMotion">Animations</label><input id="settingMotion" type="checkbox" ${data.options.motion?'checked':''}></div><div class="setting-row"><label for="settingTutorial">Tutorial hints</label><input id="settingTutorial" type="checkbox" ${data.options.tutorial?'checked':''}></div></div><p class="smallnote">Your game is saved to this browser. Save files are local to this device. Other players do not share your Packing Hall.</p><div class="btnrow"><button class="btn secondary" data-action="exportSave">Export save</button><button class="btn danger" data-action="resetSave">Reset game data</button></div>`)}
function refreshView(){showView(view)}
// Accessible input paths: tap, click, keyboard and swipe/drag are equivalent; math decisions remain with the learner.
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-view]');if(!el)return;
 if(el.dataset.view){if(ws&&view==='workspace'&&ws.phase!=='certified'&&!confirm('Leave this unfinished calculation? Your current worksheet will be lost.'))return;showView(el.dataset.view);return}
 const a=el.dataset.action,id=el.dataset.id;
 if(a==='accept'){startTicket(id);return}
 if(a==='operand')return connectOperand(el.dataset.kind,Number(el.dataset.k));
 if(a==='lookup')return lookupFound(Number(el.dataset.row),Number(el.dataset.col));
 if(a==='tile'){tileSelected=true;el.classList.add('selected');setMessage('Now select the column under the RIGHT digit.');return}
 if(a==='place'){if(!tileSelected){setMessage('First pick up the stamped product tile, then choose its destination.');note('tap');return}return placeProduct(Number(el.dataset.dropcol));}
 if(a==='shift')return chooseRowStart(Number(el.dataset.dropcol));
 if(a==='addCarry')return addPreviousCarry();
 if(a==='transferCarry')return transferNewCarry();
 if(a==='sumDigit')return enterAdditionDigit(Number(el.dataset.value));
 if(a==='swap')return swapFactors();
 if(a==='begin')return beginWork();
 if(a==='undo')return stepUndo();
 if(a==='restart'){if(confirm('Restart this calculation? Your current worksheet progress will be lost.')){const t=structuredClone(activeTicket);ws=null;activeTicket=t;setupFromTicket(t)}return}
 if(a==='backTickets'){if(confirm('Leave your current calculation?'))leaveWorksheet('tickets');return}
 if(a==='certify')return certify();
 if(a==='detail')return detail(id);if(a==='buy')return buy(id);if(a==='gear')return gear(id);if(a==='confirmGear')return doGear(id);
 if(a==='equip')return equip(id);if(a==='unequip')return unequip(id);if(a==='sell')return sellPress(id);if(a==='equipBest')return equipBest();if(a==='unequipAll')return handleUnequipAll();
 if(a==='finishToHall')return leaveWorksheet('hall');if(a==='finishToTickets')return leaveWorksheet('tickets');
 if(a==='closeModal')return closeModal();
 if(a==='empty')return showView('tickets');
 if(a==='togglePaper'){window._paper=!window._paper;renderWorkspace();return}
 if(a==='tutorial'){data.options.tutorial=!data.options.tutorial;save();renderWorkspace();return}
 if(a==='refresh-info')return showModal(`<h2>🎟 How ticket rarity works</h2><p>Stars indicate the typical procedural challenge of a ticket. Higher-tier tickets have more digits and higher selling value multipliers. The Golden Ticket is a special recommendation close to your practice level, with an additional ×1.5 selling-value bonus.</p><div class="info-row"><span>Display counter</span><strong>More visible tickets and +2.5 points Golden chance / level</strong></div><div class="info-row"><span>Delivery fleet</span><strong>Higher-tier customer access and +7.5 points Golden chance / level</strong></div><p>Tickets refresh every 3 minutes while the game is open. The alert also appears if a Golden Ticket arrives while you are solving a worksheet. Once accepted, an order will not expire halfway through a calculation.</p>`);
 if(a==='resetSave'){if(confirm('Delete all local coins, presses, and upgrades?')){data=defaultData();ws=null;activeTicket=null;refreshTickets(true);closeModal();showView('hall');toast('Fresh bakery started')}}
 if(a==='exportSave'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='batch-carry-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
});
document.addEventListener('submit',e=>{if(e.target.id==='memoryForm'){e.preventDefault();answerMemory(Number($('memoryAnswer').value))}});
document.addEventListener('change',e=>{let id=e.target.id;if(['inventorySort','inventoryFilter'].includes(id)){window._inv={sort:$('inventorySort').value,filter:$('inventoryFilter').value,search:$('inventorySearch').value};renderInventoryContent()}if(id==='settingSfx'){data.options.sfx=Number(e.target.value);save();note('tap')}if(id==='settingMusic'){data.options.music=Number(e.target.value);musicStart();save()}if(id==='settingMotion'){data.options.motion=e.target.checked;document.body.classList.toggle('reduce-motion',!data.options.motion);save()}if(id==='settingTutorial'){data.options.tutorial=e.target.checked;save()}});
document.addEventListener('input',e=>{if(e.target.id==='inventorySearch'){window._inv={sort:$('inventorySort').value,filter:$('inventoryFilter').value,search:e.target.value}; // Keep focus while filtering
 const selection=e.target.selectionStart;renderInventoryContent();let input=$('inventorySearch');input.focus();input.setSelectionRange(selection,selection)} });
document.addEventListener('keydown',e=>{if(!ws||ws.phase!=='addition'||e.target.closest('input'))return;if(e.key>='0'&&e.key<='9'){e.preventDefault();enterAdditionDigit(Number(e.key))}});
$('settingsBtn').addEventListener('click',showSettings);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
// Pointer-based gesture support (tap alternatives remain usable for mouse, keyboard and accessibility).
let gesture=null;
document.addEventListener('pointerdown',e=>{const node=e.target.closest('#productTile, [data-gesture]');if(!node||!ws)return;gesture={kind:node.id==='productTile'?'tile':node.dataset.gesture,startX:e.clientX,startY:e.clientY,original:node};});
document.addEventListener('pointerup',e=>{if(!gesture)return;let g=gesture;gesture=null;if(!ws)return;const dy=e.clientY-g.startY,dx=e.clientX-g.startX;
 if(g.kind==='tile'&&ws.phase==='place'&&Math.hypot(dx,dy)>17){tileSelected=true;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-dropcol]');if(target)placeProduct(Number(target.dataset.dropcol));else setMessage('Drop the tile onto a worksheet column.');}
 if(g.kind==='old'&&ws.phase==='oldcarry'&&dy>25){addPreviousCarry()}
 if(g.kind==='new'&&ws.phase==='newcarry'&&dy< -25){transferNewCarry()}
});
function init(){if(!data.tickets.length||Date.now()>data.refreshAt)refreshTickets(true);document.body.classList.toggle('reduce-motion',!data.options.motion);let dt=clamp((Date.now()-(data.lastTick||Date.now()))/1000,0,600);if(dt>3&&data.packers.length){data.coins+=perSecond()*dt;data.packsPacked=(data.packsPacked||0)+packsSecond()*dt;toast('Welcome back!',`Your Auto-Packers earned ${MONEY(perSecond()*dt)} coins while you were away (up to 10 minutes).`)}data.lastTick=Date.now();showView('hall');setInterval(tick,1000);musicStart();}
init();
})();
</script>
</body></html>
