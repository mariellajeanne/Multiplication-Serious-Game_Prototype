/* V3 menu-first information hierarchy */
.layout{grid-template-columns:minmax(185px,.7fr) minmax(520px,2.25fr) minmax(235px,.93fr);gap:14px;max-width:1730px;}
.topbar{background:#fff8e9}.topstats .statpill:first-child{border:2px solid #dcb36a;background:linear-gradient(135deg,#fff2c3,#fff9e8);box-shadow:0 2px 0 #d3a260}

.leftcol .scene{min-height:155px}.leftcol .navgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.leftcol .navcard{min-height:65px}.leftcol .navcard .em{font-size:1.3rem}
.menu-stage{min-height:700px;padding:23px 21px;background:radial-gradient(ellipse at 0 0,#fff9e6,#fffefa 42%,#f7e6d4)}
.menu-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.menu-title{font-family:Georgia,serif;font-size:clamp(23px,2.35vw,34px);margin:0 0 3px;color:#684634}
.menu-sub{font-size:13px;color:#997d65;font-weight:650}
.value-hero{margin:17px auto 20px;max-width:510px;text-align:center;border:2px solid #d7aa66;border-radius:20px;padding:14px 20px;background:linear-gradient(125deg,#fff0c6,#ffe0a0 45%,#fff4d7);box-shadow:0 5px 0 #deb976,0 12px 22px #a8783530}
.value-hero .caption{font-size:11px;font-weight:1000;letter-spacing:.11em;color:#885b2b;text-transform:uppercase}
.value-hero .number{font-size:clamp(33px,4vw,57px);color:#64432a;font-weight:1000;line-height:1.2;text-shadow:0 2px #fff7dd}
.value-hero small{font-weight:750;color:#90693d}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;align-content:start}
.food-tile{--fooda:#f4e5d6;--foodb:#f9f2e5;--foodedge:#cab69d;position:relative;min-width:0;height:177px;padding:0 9px 10px;border-radius:17px;border:3px solid var(--foodedge);background:linear-gradient(150deg,var(--foodb),var(--fooda));box-shadow:0 5px 0 color-mix(in srgb,var(--foodedge),#6a3f2b 25%),0 12px 18px #76533917;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center;color:#4d3529;transition:transform .17s ease,filter .17s ease}
.food-tile:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.05)}.food-tile:active{transform:translateY(2px)}
.food-tile:before{content:"";position:absolute;inset:-100% auto auto -80%;width:75%;height:310%;transform:rotate(25deg);background:linear-gradient(90deg,transparent,#ffffff43,transparent);pointer-events:none}
.food-tile .tier-banner{position:absolute;top:0;left:0;right:0;text-align:center;background:color-mix(in srgb,var(--foodedge),#2c1829 12%);color:white;font-size:11px;font-weight:1000;letter-spacing:1.2px;text-shadow:0 1px 3px #45332260;padding:7px}
.food-tile .food-icon{font-size:clamp(39px,4.1vw,61px);line-height:1.15;filter:drop-shadow(0 6px 2px #8464452d);margin-top:16px;transition:transform .15s}

function finishSum(){const r=g.run;if(!r||r.phase==='claim')return;r.phase='claim';r.pool=r.budget;const acc=r.correct/(r.correct+r.mistakes||1);if(r.mode==='bullseye')r.pool=Math.floor(r.pool*clamp(acc,.25,1));if(r.mode==='streak')r.pool=Math.floor(r.pool*(1+Math.min(1.4,r.bestStreak*.12)));save();render();coinFly(7);toast('Order complete! Open your prize jar! 🎉')}
function prizeItems(){const r=g.run;if(!r||r.phase!=='claim')return;r.rewards=r.chests.map(c=>{const choices=FOOD.filter(x=>x.rarity===c.rarity);return pick(choices)});const coins=r.pool;g.coins+=coins;for(const f of r.rewards){const uid=g.uidNext++;g.owned.push({uid,id:f.id,level:1,fusion:0,spent:0});if(g.activeMenu.length<g.menuSlots && !g.activeMenu.some(id=>g.owned.find(x=>x.uid===id)?.id===f.id))g.activeMenu.push(uid);if(!g.discovered.includes(f.id))g.discovered.push(f.id)}g.completed++;g.learning.correct+=r.correct;const old=g.permanentLuck;if(r.mistakes===0)g.mastery+=(r.mode==='normal'||r.mode==='lookup'?1:2);else if(r.correct/(r.correct+r.mistakes||1)>=.9)g.mastery+=1;g.permanentLuck=Math.floor(g.mastery/4);g.run=null;save();render();const earned=r.rewards.map((f,i)=>`<div class="rewarditem" style="animation-delay:${i*.06}s"><div class="emoji">${f.icon}</div><b>${f.name}</b><div>${rarityTag(f.rarity)}</div></div>`).join('');showModal('🎉 Order Complete!',`<div class="introbox"><div class="introart">🏆</div><h2>Great baking!</h2><h1 style="color:#477d63">+${fmt(coins)} coins</h1><div class="small muted">${r.chests.length} chest${r.chests.length===1?'':'s'} collected</div></div><div style="height:12px"></div><div class="rewardreveal">${earned}</div>${old<g.permanentLuck?'<p class="successbox" style="margin-top:14px">🌟 Your multiplication mastery increased your permanent Ticket Luck!</p>':''}<div class="btnrow" style="justify-content:center;margin-top:20px"><button class="primary" onclick="closeModal()">Keep Growing My Bakery →</button></div>`);checkUnlocks()}
function checkUnlocks(){const unlocks=[['kitchen',2,'🔥 Kitchen upgrades are now open!'],['decor',4,'🌷 Decorations unlocked — your worksheet can evolve!'],['fusion',5,'✨ Food fusion and ingredients unlocked!'],['staff',6,'🧑‍🍳 Temporary staff can now help your bakery!'],['challenges',3,'🎮 New challenge modes are appearing!']];for(const [key,at,msg] of unlocks){if(g.completed>=at&&!g.seenUnlocks.includes(key)){g.seenUnlocks.push(key);toast(msg)}}save()}
function foodLevelCost(o){return Math.round(145*Math.pow(F(o.id).rarity+1,1.55)*Math.pow(o.level,2.1))}
function fusionFee(o){return Math.round(190*Math.pow(F(o.id).rarity+1,1.65)*Math.pow(o.fusion+1,2))}
function ingredientNeeds(o){const f=F(o.id);const qty=[2,7,22][o.fusion]*(1+Math.floor(f.rarity/2));return f.ingredients.map((name,i)=>({name,need:Math.round(qty*(i===1?.7:1)),have:g.ingredients[name]||0,price:INGREDIENTS.find(x=>x[0]===name)[2]}))}
function fusionIngredientCost(o){return ingredientNeeds(o).reduce((s,x)=>s+Math.max(0,x.need-x.have)*x.price,0)}
function upgradeFood(uid){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}const o=g.owned.find(x=>x.uid===uid);if(!o||o.level>=3)return;const cost=foodLevelCost(o);if(g.coins<cost){toast('Not enough coins yet — solve another order!');return}g.coins-=cost;o.spent+=cost;o.level++;save();render();openMenu();toast(`${F(o.id).name} is now Level ${o.level}!`)}
function fuseDuplicate(uid){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}const o=g.owned.find(x=>x.uid===uid);if(!o||o.fusion>=3)return;const dup=g.owned.find(x=>x.id===o.id&&x.uid!==uid),cost=fusionFee(o);if(!dup){toast('You need another copy of the exact same food.');return}if(g.coins<cost){toast('Not enough coins for the fusion fee.');return}g.coins-=cost;o.fusion++;o.spent+=cost+dup.spent;g.owned=g.owned.filter(x=>x.uid!==dup.uid);g.activeMenu=g.activeMenu.filter(x=>x!==dup.uid);save();render();openMenu();toast(`✨ ${F(o.id).name} fused to Tier ${o.fusion}!`)}
function fuseIngredients(uid){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}const o=g.owned.find(x=>x.uid===uid);if(!o||o.fusion>=3)return;const fee=fusionFee(o),buy=fusionIngredientCost(o),total=fee+buy;if(g.coins<total){toast(`Need ${fmt(total-g.coins)} more coins for this fusion.`);return}g.coins-=total;o.spent+=total;for(const i of ingredientNeeds(o))g.ingredients[i.name]=Math.max(0,(g.ingredients[i.name]||0)-i.need);o.fusion++;save();render();openMenu();toast(`✨ Ingredients fused into ${F(o.id).name}!`)}
function buyIngredient(name,count){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}const data=INGREDIENTS.find(x=>x[0]===name);if(!data)return;const amount=data[2]*count;if(g.coins<amount){toast('Need more coins to buy these ingredients.');return}g.coins-=amount;g.ingredients[name]=(g.ingredients[name]||0)+count;save();render();openIngredients();toast(`Bought ${count} × ${name}`)}
function baseResale(o){return Math.round(F(o.id).base*45)}
function resalePrice(o){return baseResale(o)+Math.floor(o.spent*.5)}
function sellFoodPrompt(uid){const o=g.owned.find(x=>x.uid===uid);if(!o)return;const f=F(o.id);showModal(`Sell ${f.name}?`,`<div class="introbox"><div class="introart">${f.icon}</div><h2>${f.name}</h2><p>You will sell the <strong>entire food item</strong>, including its levels and fusion tiers.</p><h1>+${fmt(resalePrice(o))} 🪙</h1><p class="muted small">Base resale ${fmt(baseResale(o))} + 50% of ${fmt(o.spent)} upgrade coins invested</p></div><div class="warning" style="margin-top:12px">It remains in your <strong>Collection Index</strong>, but must be found again from a chest if you want to own it. Your bakery multiplier will decrease.</div><div class="btnrow" style="justify-content:flex-end;margin-top:15px"><button class="secondary" onclick="openMenu()">Keep It</button><button class="primary" style="background:#ad6c4a" onclick="sellFood(${uid})">Sell whole food</button></div>`)}
function sellFood(uid){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}const o=g.owned.find(x=>x.uid===uid);if(!o)return;g.coins+=resalePrice(o);g.owned=g.owned.filter(x=>x.uid!==uid);g.activeMenu=g.activeMenu.filter(x=>x!==uid);save();render();openMenu();toast('Food sold. Its discovery is safe in your Index!')}
function equipmentCost(k){const lvl=g.equipment[k.id]||0;return Math.round((300+150*KITCHEN.indexOf(k))*Math.pow(lvl+1,1.9))}
function upgradeEquipment(id){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}if(g.completed<2)return;const k=KITCHEN.find(x=>x.id===id);if(!k||g.equipment[id]>=5)return;const c=equipmentCost(k);if(g.coins<c){toast('That upgrade is a little expensive. Try another path!');return}g.coins-=c;g.equipment[id]++;save();render();openKitchen();toast(`${k.name} improved! All menu foods benefit.`)}
const decorCosts=[550,2200,8800,35000];function upgradeDecor(){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}if(g.completed<4||g.decor>=4)return;const price=decorCosts[g.decor];if(g.coins<price){toast('Not enough coins for renovation yet.');return}g.coins-=price;g.decor++;save();render();openDecor();toast('✨ Your bakery AND worksheet just got prettier!')}
function staffRate(){return Math.max(.4,bakeryValue()*.76)}
function hireStaff(){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}if(g.completed<6)return;if(g.staff.until>Date.now()){toast('Your helper is already working!');return}const rate=staffRate(),cost=Math.ceil(rate*36);if(g.coins<cost){toast('You need a few more coins to hire a helper.');return}g.coins-=cost;g.staff={until:Date.now()+120000,rate,lastTick:Date.now(),fraction:0};save();render();openStaff();toast('🧑‍🍳 Helper hired for a 2-minute demo shift!')}
function tickStaff(){const s=g.staff;if(!s||!s.until||s.until<=0)return;const now=Date.now(),end=Math.min(now,s.until),start=s.lastTick||now,passed=Math.max(0,(end-start)/1000);if(passed>0){const amount=passed*s.rate+(s.fraction||0);g.coins+=Math.floor(amount);s.fraction=amount-Math.floor(amount);s.lastTick=end}if(now>=s.until){s.until=0;s.lastTick=now;toast('Your temporary helper finished their shift!')}save();const coinEl=$('walletCoins');if(coinEl)coinEl.textContent=fmt(g.coins);const staffEl=$('staffTimer');if(staffEl)staffEl.textContent=s.until?Math.ceil((s.until-now)/1000)+'s remaining':'Not working'}
function chooseMode(id){const m=MODE.find(x=>x.id===id);if(!m||g.completed<m.unlock)return;if(g.run){toast('Finish the current ticket before switching modes.');return}g.mode=id;save();render();openModes();toast(`${m.name} mode selected`)}
function chooseLives(n){if(g.run)return;g.lives=n;save();render()}
function retryRun(){const r=g.run;if(!r||r.phase!=='failed')return;if(r.retriesLeft<=0){toast('No challenge retries left. Switch to Normal to continue.');return}r.retriesLeft=r.retriesLeft===Infinity?Infinity:r.retriesLeft-1;r.index=0;r.phase='engine';r.pool=0;r.earnedActive=0;r.luck=0;r.chests=[];r.mistakes=0;r.correct=0;r.bridgeDone=0;r.bridgeSig='';r.bridgePrev={};save();render();toast('Try again! Your pending rewards reset.')}
function retryNormal(){const r=g.run;if(!r)return;const t=r.ticket;g.run=null;g.mode='normal';g.board.unshift(t);g.board=g.board.slice(0,3);save();render();startTicket(t.id)}
function abandonTicket(){if(!g.run)return;const yes=confirm('Leave this unfinished ticket? Pending coins and chests will be lost.');if(!yes)return;g.run=null;save();render();toast('You can choose a new order.');}
function showTutorial(index=0){g.tutorialIndex=index;const t=BASIC_TUTORIAL[index],last=index===BASIC_TUTORIAL.length-1;showModal('👩‍🍳 How to Play',`<div class="introbox"><div class="introart float-icon">${t.emoji}</div><h2>${t.title}</h2><p style="line-height:1.65;max-width:540px;margin:auto">${t.text}</p><div class="introsteps">${BASIC_TUTORIAL.map((_,i)=>`<i class="${i===index?'on':''}"></i>`).join('')}</div></div><div class="btnrow" style="justify-content:space-between;margin-top:18px"><button class="secondary" onclick="skipTutorial()">Skip</button><div class="btnrow">${index?`<button class="secondary" onclick="showTutorial(${index-1})">← Back</button>`:''}<button class="primary" onclick="${last?'skipTutorial()':`showTutorial(${index+1})`}">${last?'Let’s Bake!':'Next →'}</button></div></div>`)}
function skipTutorial(){g.helpSeen=true;save();closeModal();}
function openMenu(){const cards=g.owned.map(o=>{const f=F(o.id),lcost=foodLevelCost(o),fcost=fusionFee(o),dup=g.owned.some(x=>x.id===o.id&&x.uid!==o.uid);return `<div class="itemcard"><div class="itemtop"><div class="foodemoji">${f.icon}</div><div><b>${f.name}</b><div>${rarityTag(f.rarity)}</div></div></div><div class="costrow"><span class="small">Food value</span><strong>×${foodValue(o).toFixed(2)}</strong></div><div class="minitext">Level ${o.level}/3 · Fusion ${o.fusion}/3 · Spent ${fmt(o.spent)} coins</div><div class="itemactions"><button class="secondary mini" ${o.level>=3?'disabled':''} onclick="upgradeFood(${o.uid})">${o.level===3?'MAX LEVEL':`Level +20% · ${fmt(lcost)} 🪙`}</button></div><div class="itemactions"><button class="secondary mini" ${o.fusion>=3?'disabled':''} onclick="fuseDuplicate(${o.uid})">Fuse duplicate ${dup?'✓':'✕'}</button><button class="secondary mini" ${o.fusion>=3?'disabled':''} onclick="ingredientFusionInfo(${o.uid})">Ingredients →</button></div><div class="itemactions"><button class="tertiary mini" onclick="sellFoodPrompt(${o.uid})">Sell entire food · ${fmt(resalePrice(o))} 🪙</button></div></div>`}).join('');showModal('🍞 My Filipino Bakery Menu',`<div class="successbox" style="margin-bottom:13px">Only foods placed in your <b>active menu slots</b> contribute to Bakery Value; extra copies are useful for fusion or resale. <b>Level up</b> with coins, <b>fuse</b> duplicates or bought ingredients, or sell an old food to fund new upgrades.</div><div class="btnrow" style="margin-bottom:13px"><button class="secondary mini" onclick="openIndex()">📒 Collection Index (${g.discovered.length}/${FOOD.length})</button><button class="secondary mini" ${g.completed<5?'disabled':''} onclick="openIngredients()">🛒 Ingredient Shop ${g.completed<5?'(unlocks after 5 orders)':''}</button></div>${cards?`<div class="modalgrid">${cards}</div>`:'<div class="introbox"><h2>Your menu is empty!</h2><p>Solve another ticket to discover food from chests.</p></div>'}`)}
function ingredientFusionInfo(uid){const o=g.owned.find(x=>x.uid===uid);if(!o||o.fusion>=3)return;const need=ingredientNeeds(o),fee=fusionFee(o),missing=fusionIngredientCost(o);showModal('🧺 Ingredient Fusion',`<p style="margin-bottom:15px">Fuse <strong>${F(o.id).name}</strong> to Tier ${o.fusion+1}. Ingredient prices remain fixed no matter how often you buy them.</p>${need.map(x=>`<div class="costrow"><div><b>${x.name}</b><div class="minitext">Have ${x.have} / Need ${x.need} · ${x.price} coins each</div></div><b>${fmt(Math.max(0,x.need-x.have)*x.price)} 🪙</b></div>`).join('')}<div class="divider"></div><div class="costrow"><b>Missing ingredients</b><b>${fmt(missing)} 🪙</b></div><div class="costrow"><b>Base fusion fee</b><b>${fmt(fee)} 🪙</b></div><div class="costrow" style="background:#e9f2e6"><b>Total coins needed</b><h2>${fmt(missing+fee)} 🪙</h2></div><p class="small muted">Alternative: find another ${F(o.id).name} in a chest and pay only the fusion fee.</p><div class="btnrow" style="margin-top:14px"><button class="secondary" onclick="openMenu()">← Back to menu</button><button class="primary" ${g.coins<missing+fee?'disabled':''} onclick="fuseIngredients(${uid})">Buy Missing + Fuse</button></div>`)}
function openIngredients(){if(g.completed<5){toast('Ingredients unlock after 5 completed orders.');return}showModal('🛒 Ingredient Market',`<div class="successbox" style="margin-bottom:12px">All ingredients are always available at <b>fixed prices</b>. Higher fusion tiers require larger quantities. You can also buy the missing ingredients automatically from the Menu.</div><div class="modalgrid">${INGREDIENTS.map(x=>`<div class="itemcard"><div class="itemtop"><div class="foodemoji">${x[1]}</div><div><b>${x[0]}</b><div class="minitext">Own ${(g.ingredients[x[0]]||0)} · ${x[2]} coins each</div></div></div><div class="itemactions"><button class="secondary mini" onclick="buyIngredient('${x[0]}',1)">Buy 1 · ${x[2]} 🪙</button><button class="secondary mini" onclick="buyIngredient('${x[0]}',5)">Buy 5 · ${x[2]*5} 🪙</button></div></div>`).join('')}</div><div class="btnrow" style="margin-top:15px"><button class="secondary" onclick="openMenu()">← Back to Menu</button></div>`)}
function openKitchen(){if(g.completed<2){toast('Kitchen upgrades unlock after 2 orders.');return}showModal('🔥 Kitchen Upgrades',`<div class="successbox" style="margin-bottom:13px">Every piece of kitchenware improves <b>ALL foods</b>. No categories, no slots, no complicated equipment assignments.</div><div class="modalgrid">${KITCHEN.map(k=>{const lvl=g.equipment[k.id],cost=equipmentCost(k);return `<div class="itemcard"><div class="itemtop"><div class="foodemoji">${k.icon}</div><div><b>${k.name}</b><div class="minitext">Level ${lvl}/5 · +${Math.round(lvl*k.bonus*100)}% bakery food value</div></div></div><div class="progress"><div class="bar" style="width:${lvl*20}%"></div></div><button class="primary" ${lvl>=5||g.coins<cost?'disabled':''} onclick="upgradeEquipment('${k.id}')">${lvl>=5?'Max Level':`Upgrade · ${fmt(cost)} 🪙`}</button></div>`}).join('')}</div><p class="small muted" style="margin-top:16px">Combined kitchen bonus: <b>+${((kitchenBonus()-1)*100).toFixed(1)}%</b> to every food.</p>`)}
function openDecor(){if(g.completed<4){toast('Decorations unlock after 4 orders.');return}const labels=['Starter Bakery','Cozy Bakery','Flower-Filled Café','Elegant Patisserie','Golden Panaderya'];const next=g.decor<4?decorCosts[g.decor]:0;showModal('🌷 Bakery + Worksheet Decor',`<div class="introbox"><div class="introart">${['🪵','🪴','💐','🖼️','✨'][g.decor]}</div><h2>${labels[g.decor]}</h2><p>Every renovation makes your bakery AND your multiplication worksheet prettier. It also boosts your overall bakery value.</p><h1>×${decorBonus().toFixed(2)} overall</h1><p class="small muted">Includes improved colors, borders, countertops, flowers, displays, and visual details.</p></div><div class="btnrow" style="margin-top:15px;justify-content:center"><button class="primary" ${g.decor>=4||g.coins<next?'disabled':''} onclick="upgradeDecor()">${g.decor>=4?'Fully Renovated!':`Next Renovation · ${fmt(next)} 🪙`}</button></div><p class="small muted" style="margin-top:13px">🎵 Optional music can be toggled in Settings. As renovations progress, the bakery's background style changes.</p>`)}
function openStaff(){if(g.completed<6){toast('Staff unlock after 6 completed orders.');return}const running=g.staff.until>Date.now(),rate=staffRate(),fee=Math.ceil(rate*36);showModal('🧑‍🍳 Temporary Helpers',`<div class="introbox"><div class="introart">👩‍🍳</div><h2>${running?'Your helper is working!':'Hire a Bakery Helper'}</h2><p>Helpers earn a little money while you work, but <b>solving tickets is targeted to earn roughly 3× faster</b> at a comfortable pace, plus chests and mastery.</p><h1>${rate.toFixed(1)} coins / second</h1><p class="small muted">2-minute demo shift · Pay ${fmt(fee)} upfront · Your bakery multiplier scales their wages and output</p><div id="staffTimer" class="small muted">${running?Math.ceil((g.staff.until-Date.now())/1000)+'s remaining':'Not working'}</div></div><div class="btnrow" style="justify-content:center;margin-top:14px"><button class="primary" ${running||g.coins<fee?'disabled':''} onclick="hireStaff()">${running?'Already Hired':`Hire · ${fmt(fee)} 🪙`}</button></div>`)}
function openIndex(){showModal('📒 Food Collection Index',`<p class="small muted" style="margin-bottom:13px">Discovered foods stay marked as unlocked even if you sell every copy. You must obtain another copy from a chest to use a sold food again.</p><div class="modalgrid">${FOOD.map(f=>{const seen=g.discovered.includes(f.id),own=g.owned.filter(x=>x.id===f.id).length;return `<div class="itemcard" style="opacity:${seen?1:.62}"><div class="itemtop"><div class="foodemoji">${seen?f.icon:'❔'}</div><div><b>${seen?f.name:'Undiscovered food'}</b><div>${rarityTag(f.rarity)}</div></div></div><div class="minitext">${seen?'✓ Discovered':'Not yet discovered'} · ${own} owned</div></div>`}).join('')}</div><div class="btnrow" style="margin-top:16px"><button class="secondary" onclick="openMenu()">← Back to Menu</button></div>`)}

function openSettings(){showModal('⚙️ Settings + How to Play',`<div class="modalgrid"><div class="itemcard"><h3>Guided Tutorial</h3><p class="small">Replay the five-step introduction anytime.</p><button class="secondary" onclick="showTutorial(0)">👩‍🍳 Replay Tutorial</button></div><div class="itemcard"><h3>Background Music (Optional)</h3><p class="small">A soft synthesized melody with richer notes as your bakery grows.</p><button class="secondary" onclick="toggleMusic()">🎵 Music: ${g.musicOn?'ON':'OFF'}</button></div><div class="itemcard"><h3>Prototype Testing</h3><p class="small">Try every feature immediately, or clear all progress.</p><button class="secondary" onclick="unlockDemo()">🧪 Unlock All + Test Coins</button><button class="secondary" onclick="resetGame()">↻ Start Over</button></div></div><div class="divider"></div><h3>How long multiplication works here</h3><p class="explainline">Select the glowing multiplier digit, then the glowing multiplicand digit. Tap the floating M × N to reveal tiles. Put the ones tile in the current partial-product row, and send tens upward as a carry. When a carry is waiting, you can merge it before or after placing the digits. At the end, merge partial products with a downward swipe or button.</p>`)}

function resetGame(){if(!confirm('Erase all saved Panaderya Quest prototype progress?'))return;g=fresh();refillBoard();save();closeModal();render();showTutorial()}
function toggleMusic(){g.musicOn=!g.musicOn;save();if(g.musicOn){startMusic()}else stopMusic();openSettings()}
function startMusic(){if(musicTimer)return;try{music=new(window.AudioContext||window.webkitAudioContext)();let i=0;musicTimer=setInterval(()=>{if(!g.musicOn)return;const extra=g.decor>=2?2:0;const seq=[60,64,67,72,67,64,62,67,65,62,60,67];const midi=seq[i++%seq.length]+(extra&&i%8===0?12:0);const osc=music.createOscillator(),gain=music.createGain();osc.type='sine';osc.frequency.value=440*Math.pow(2,(midi-69)/12);gain.gain.setValueAtTime(.0001,music.currentTime);gain.gain.exponentialRampToValueAtTime(.017,music.currentTime+.04);gain.gain.exponentialRampToValueAtTime(.0001,music.currentTime+.32);osc.connect(gain).connect(music.destination);osc.start();osc.stop(music.currentTime+.34)},400)}catch(e){g.sound=false;toast('Music unavailable in this browser.')}}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(music){music.close();music=null}}
function openProbabilities(){const cap=highestRarity();showModal('🎟️ Ticket Chances & Mastery',`<div class="successbox">Your permanent luck increases as you demonstrate multiplication mastery. It shifts the chance of receiving higher-grade tickets. The ticket grade then influences chest grade.</div><p style="margin:14px 0"><b>Mastery:</b> ${g.mastery} · <b>Permanent Ticket Luck:</b> +${g.permanentLuck} · <b>Maximum available grade:</b> ${RARITIES[cap]}</p><p class="small muted">Early tickets are mostly Common. Lower grades can disappear from the normal pool after enough retained practice. You may still encounter easier work in practice modes.</p><div class="divider"></div><h3>Ticket → chest grade relationship</h3><p class="explainline">A better-grade ticket shifts chest rewards toward higher rarities, without guaranteeing a high-rarity item. Temporary Luck only affects the chance that a chest drops, not its rarity.</p>`)}
function goalHTML(){const goals=[];const u=g.owned.find(o=>o.level<3);if(u){const cost=foodLevelCost(u);goals.push({label:`Level up ${F(u.id).name}`,detail:`${fmt(g.coins)} / ${fmt(cost)} coins`,progress:clamp(g.coins/cost*100,0,100)})}if(g.completed>=2){const k=KITCHEN.find(x=>g.equipment[x.id]<5);if(k){const c=equipmentCost(k);goals.push({label:`Upgrade ${k.name}`,detail:`${fmt(g.coins)} / ${fmt(c)} coins`,progress:clamp(g.coins/c*100,0,100)})}}const next=[2,4,5,6,8,11,16,20].find(x=>x>g.completed)||g.completed+5;goals.push({label:'Next feature / milestone',detail:`${g.completed} / ${next} orders`,progress:clamp(g.completed/next*100,0,100)});return goals.slice(0,3).map(o=>`<div class="goalrow"><b>${o.label}</b><span class="muted tiny">${o.detail}</span><div class="progress"><div class="bar" style="width:${o.progress}%"></div></div></div>`).join('')}
function themeLevel(){return g.decor}
function renderBakery(){const best=[...g.owned].sort((a,b)=>foodValue(b)-foodValue(a)).slice(0,3);return `<div class="panel panelpad"><div class="panelheader"><h2>🏡 Your Panaderya</h2><span class="pill">Lv. ${1+g.decor}</span></div><div class="scene level${Math.min(3,themeLevel())}"><div class="bakerylabel">PANADERYA</div><div class="window"></div><div class="shelf"></div><div class="shelffood">${best.map(o=>F(o.id).icon).join(' ')||'🍞'}</div><div class="counter"></div><div class="on-counter">${best.length?F(best[0].id).icon:'🥐'} ${best.length>1?F(best[1].id).icon:'🍞'}</div><div class="oven">${g.equipment.oven?'🔥':'🥣'}</div>${g.decor>=1?'<div class="scene-flower">🪴</div>':''}${g.decor>=2?'<div class="scene-art">🖼️</div>':''}${g.decor>=3?'<div class="scene-shine">✨</div>':''}</div><div class="scene-progress"><div class="panelheader" style="margin-bottom:7px"><span class="small muted">Bakery Value</span><strong>×${bakeryValue().toFixed(2)}</strong></div><div class="progress"><div class="bar" style="width:${Math.min(100,bakeryValue()*4)}%"></div></div></div></div>`}
function renderLeft(){const nav=[{name:'Menu',e:'🍞',desc:'Manage food',fn:'openMenu()',unlock:0},{name:'Kitchen',e:'🔥',desc:'Global boosts',fn:'openKitchen()',unlock:2},{name:'Decor',e:'🌷',desc:'Make it prettier',fn:'openDecor()',unlock:4},{name:'Staff',e:'👩‍🍳',desc:'Hire staff',fn:'openStaff()',unlock:6},{name:'Index',e:'📒',desc:'Discoveries',fn:'openIndex()',unlock:0},{name:'Modes',e:'🎮',desc:'Challenges',fn:'openModes()',unlock:0},{name:'Help',e:'❓',desc:'Tutorial',fn:'showTutorial(0)',unlock:0}];return `<aside class="leftcol">${renderBakery()}<div class="panel panelpad"><div class="panelheader"><h2>Bakery Tools</h2></div><div class="navgrid">${nav.map(n=>`<button class="navcard ${g.completed<n.unlock?'locked':''}" onclick="${n.fn}"><span class="em">${g.completed<n.unlock?'🔒':n.e}</span><span class="cap">${n.name}</span></button>`).join('')}</div></div></aside>`}
function progressText(r){return r.phase==='failed'?'Challenge ended':r.phase==='sum'?'All combos complete — merge rows!':r.phase==='claim'?'Ticket completed!':`${r.index+1} of ${r.steps.length} digit combos`}
function workInstruction(){const r=g.run;if(!r)return 'Choose a ticket on the right to begin your first order!';const s=runCurrent();switch(r.phase){case'chooseB':return `① Tap the glowing BOTTOM digit (${s.b}).`;case'chooseA':return `② Tap the glowing TOP digit (${s.a}).`;case'reveal':return `③ Tap the ${s.a} × ${s.b} bubble to get your digit tiles.`;case'place':if(s.carryIn&&!r.addedCarry)return `④ Place your digits, and remember to ADD the previous carry (+${s.carryIn})!`;return '④ Tap a number tile, then put it in its correct destination.';case'sum':return 'Great job! Swipe down or tap below to merge partial products.';case'claim':return 'Your ticket is ready! Open the prize jar to collect rewards.';case'failed':return 'You ran out of lives. You may retry, or use Normal mode.';default:return 'Follow the highlighted digits.'}}
function mathDigitRow(digits,which,r){const s=runCurrent(),active=r&&s&&((which==='top'&&r.phase==='chooseA')||(which==='bottom'&&r.phase==='chooseB'));const idx= s?(which==='top'?digits.length-1-s.col:digits.length-1-s.row):-1;return `<div class="digitrow">${which==='bottom'?'<div class="mathsign">×</div>':''}${digits.map((d,i)=>{let cl=active&&idx===i?'ready active':r&&(r.phase==='chooseB'||r.phase==='chooseA')?'dim':'';return `<button class="mathdigit ${cl}" onclick="${which==='top'?`pickMultiplicand(${i})`:`pickMultiplier(${i})`}" ${active&&idx===i?'': 'tabindex="-1"'}>${d}</button>`}).join('')}</div>`}
function partialRows(r){const raw=String(r.ticket.b),len=raw.length;return Array.from({length:len},(_,row)=>{const data=r.partial[row]||{};const completed=r.steps.filter(x=>x.row===row).every(x=>x.row<r.steps[r.index]?.row||r.index>r.steps.indexOf(x));const max=Math.max(...Object.keys(data).map(Number),row+String(r.ticket.a).length-1);let text='';for(let p=max;p>=0;p--)text+=String(data[p]??(p<row?'0':'·'));if(!Object.keys(data).length)text='· · ·';return `<div class="partialrow ${r.steps[r.index]?.row===row?'current':''}"><span class="rowflag">${row===0?'Ones row':row===1?'Tens row':row===2?'Hundreds row':'Row '+(row+1)}</span><span>${text.replace(/\B(?=(\d{3})+(?!\d))/g,',')}</span></div>`}).join('')}
function tileDisplay(r,s){const sum=(r.addedCarry?s.p+s.carryIn:s.p),tens=Math.floor(sum/10),ones=sum%10;const tiles=[];if(tens>0)tiles.push(`<button class="tile ${r.selectedTile==='tens'?'selected':''} ${r.placedTens?'used':''}" onclick="tileSelect('tens')" title="Tens digit">${tens}</button>`);tiles.push(`<button class="tile ${r.selectedTile==='ones'?'selected':''} ${r.placedOnes?'used':''}" onclick="tileSelect('ones')" title="Ones digit">${ones}</button>`);return `<div class="producttiles">${tiles.join('')}${s.carryIn&&!r.addedCarry?`<button class="carrypill" onclick="addCarry()">↗ Add previous carry +${s.carryIn}</button>`:''}${s.carryIn&&r.addedCarry?`<span class="foodtag">✓ Carry +${s.carryIn} merged</span>`:''}</div><div class="destinations"><button class="dest" onclick="placeTile('ones')"><span class="dlabel">⬇️ ONES TO ROW</span><span class="dvalue">${r.placedOnes?'✓ Placed':'Tap to place'}</span></button><button class="dest" onclick="placeTile('tens')" ${tens===0?'disabled':''}><span class="dlabel">⬆️ ${s.last?'LEADING DIGIT':'CARRY TO NEXT DIGIT'}</span><span class="dvalue">${tens===0?'No carry':r.placedTens?'✓ Placed':'Tap to carry'}</span></button></div><p class="tiny muted" style="text-align:center;margin-top:8px">${s.carryIn&&!r.addedCarry?'You may place the original tiles before adding your previous carry.':'Select a tile, then its correct place. Order is up to you.'}</p>`}
function renderWorksheet(){const r=g.run;const s=runCurrent();const modeName=r?(MODE.find(m=>m.id===r.mode)||MODE[0]).name:infoMode().name;return `<main class="panel worksheetwrap theme${Math.min(3,themeLevel())}"><div class="worksheet-header"><div><h2>🧾 Order Worksheet</h2><div class="small muted">Connect • Carry • Complete • Collect!</div></div><div class="badge">${r?rarityTag(r.ticket.rarity):'Ready to bake'}</div></div><div class="workpaper"><div class="work-top"><span class="modebadge">${MODE.find(m=>m.id===modeName.toLowerCase())?.icon||'✏️'} ${modeName} Mode</span><span class="tiny muted">${r?progressText(r):'Ready for your first order'}</span></div><div class="worksheet-guide">${workInstruction()}</div>${r?`<div class="math">${mathDigitRow(String(r.ticket.a).split(''),'top',r)}${mathDigitRow(String(r.ticket.b).split(''),'bottom',r)}<div class="partialarea">${partialRows(r)}</div><div class="finalsum">${r.phase==='claim'?fmt(r.ticket.a*r.ticket.b):r.phase==='sum'?'↓  ↓  ↓':'— — —'}</div></div><div class="floatbox">${r.phase==='reveal'?`<button class="mathprompt" onclick="revealProduct()">${s.a} × ${s.b} · Tap! ✨</button>`:''}${r.phase==='place'?`<div>${tileDisplay(r,s)}</div>`:''}${r.phase==='sum'?`<button class="primary" id="mergeBtn" onclick="finishSum()" ontouchstart="window._swipeY=event.touches[0].clientY" ontouchend="if(event.changedTouches[0].clientY-window._swipeY>28)finishSum()">⬇️ Merge Partial Products</button>`:''}${r.phase==='claim'?`<button class="primary" onclick="prizeItems()">🏆 Claim Coins & Open Chests!</button>`:''}${r.phase==='failed'?`<div style="text-align:center"><h2>💔 No lives left</h2><p class="small muted">You can retry this challenge (${r.retriesLeft===Infinity?'unlimited':r.retriesLeft} left) or continue in Normal mode.</p><div class="btnrow" style="justify-content:center;margin-top:10px"><button class="secondary" ${r.retriesLeft<=0?'disabled':''} onclick="retryRun()">↻ Retry</button><button class="primary" onclick="retryNormal()">Try Normal Mode</button></div></div>`:''}${(r.phase==='chooseA'||r.phase==='chooseB')?'<div class="leftnote">Follow the highlighted numbers above ☝️</div>':''}</div>`:`<div class="introbox" style="margin:30px 6px"><div class="introart float-icon">🥐</div><h2>Ready for your first order?</h2><p>Pick a ticket from the board. Tap glowing digits to connect them and practice long multiplication step by step.</p><button class="secondary" onclick="showTutorial(0)">👩‍🍳 Show me how!</button></div>`}${r&&r.mode==='lookup'?`<details style="margin:12px auto;max-width:410px"><summary class="small" style="cursor:pointer">🔢 Multiplication lookup table</summary><div class="lookup">${Array.from({length:81},(_,i)=>`<div>${Math.floor(i/9)+1}×${i%9+1}=${(Math.floor(i/9)+1)*(i%9+1)}</div>`).join('')}</div></details>`:''}</div><div class="workfooter"><div class="prizejar" id="prizejar"><div class="jaricon">🏆</div><div><div class="tiny muted" style="font-weight:900;letter-spacing:1px">PENDING PRIZE POOL</div><div class="num num" id="pendingCoins">🪙 ${fmt(r?.pool||0)}</div><div class="jarlabels"><span class="small">🎁 ${r?.chests.length||0} chest${(r?.chests.length||0)===1?'':'s'}</span><span class="tiny muted">${r?'Finish to claim':'Waiting for a ticket'}</span></div></div></div><div class="luck"><div class="tiny muted"><b>✨ Combo Luck</b></div><strong>+${r?.luck||0}</strong><div class="progress"><div class="bar" style="width:${Math.min(100,(r?.luck||0)*3)}%;background:linear-gradient(90deg,#c6a3df,#a275cb)"></div></div><div class="tiny muted">${r&&s?Math.round(clamp((.12+r.luck*.013+s.row*.03)*100,6,83))+'% next chest':'Chest chance ↑'}</div></div></div><div class="workfooter"><div class="small muted">${r&&r.mode==='survival'?`❤️ Lives: ${r.livesLeft} · `:''}${r&&r.mode==='streak'?`🔥 Streak: ${r.streak} · `:''}${r&&r.mode==='bullseye'?`🎯 Errors: ${r.mistakes} · `:''}Your progress is saved automatically.</div>${r&&r.phase!=='claim'?`<button class="tertiary mini" onclick="abandonTicket()">Leave ticket</button>`:''}<button class="tertiary mini" onclick="showTutorial(1)">❔ Help</button></div></main>`}
function renderTickets(){return `<div class="panel tickets-only"><div class="panelheader"><h2>🎟️ Order Tickets</h2><button class="tertiary mini" onclick="openProbabilities()">Chances ↗</button></div><p class="small muted" style="margin-bottom:13px">Choose a ticket to solve. Shiny colors show its rarity!</p><div class="tickets">${g.board.map(t=>`<button class="ticket r${t.rarity}" ${g.run?'disabled':''} onclick="startTicket(${t.id})"><div><div class="rarity-title">✦ ${RARITIES[t.rarity]} ORDER</div><div class="eq">${t.a} × ${t.b}</div><div class="ticket-note">${String(t.a).length*String(t.b).length} combos · 🪙 ${fmt(Math.round(t.base*bakeryValue()))}+</div></div><div style="font-size:1.9rem">${['🥖','🍞','🥐','🧁','🍰','👑'][t.rarity]}</div></button>`).join('')}</div><div class="hintbox" style="margin-top:12px"><b>🌟 Ticket Luck +${g.permanentLuck}</b><div class="tiny">Get better tickets as your multiplication mastery grows.</div></div></div>`}
function renderModePanel(){return `<div class="panel panelpad"><div class="panelheader"><h2>🎮 Play Modes</h2><button class="tertiary mini" onclick="openModes()">Learn more</button></div><div class="modeoptions">${MODE.map(m=>`<button class="${g.mode===m.id?'on':''}" ${g.completed<m.unlock||g.run?'disabled':''} onclick="chooseMode('${m.id}')">${g.completed<m.unlock?'🔒':m.icon} ${m.name}${g.completed<m.unlock?` · ${m.unlock}`:''}</button>`).join('')}</div>${g.mode==='survival'?`<div class="lives"><span>❤️ Lives:</span>${[1,3,5].map(n=>`<button class="${g.lives===n?'on':''}" ${g.run?'disabled':''} onclick="chooseLives(${n})">${n}</button>`).join('')}</div>`:''}<div class="hintbox" style="margin-top:10px">${infoMode().icon} <b>${infoMode().name}:</b> ${infoMode().desc}</div></div>`}
function renderRight(){return `<aside class="rightcol">${renderTickets()}</aside>`}

let engineDoc=null;
function engineHTML(){if(!engineDoc)engineDoc=new TextDecoder().decode(Uint8Array.from(atob(V33_DATA),x=>x.charCodeAt(0)));return engineDoc}
function sendEngine(type,data={}){const fr=$('v33Frame');if(fr?.contentWindow)fr.contentWindow.postMessage({source:'bc-shell',type,...data},'*')}
function toggleArrows(){g.tutorialArrows=!g.tutorialArrows;save();sendEngine('tutorial',{enabled:g.tutorialArrows});const b=$('arrowToggle');if(b){b.textContent=g.tutorialArrows?'➜ Tutorial arrows ON':'➜ Tutorial arrows OFF';b.setAttribute('aria-pressed',String(g.tutorialArrows))}}
function toggleSfx(){g.sound=!g.sound;save();sendEngine('sound',{enabled:g.sound,volume:1});const b=$('sfxToggle');if(b){b.textContent=g.sound?'🔊 Sounds ON':'🔈 Sounds OFF';b.setAttribute('aria-pressed',String(g.sound))}toast(g.sound?'Sounds enabled':'Sounds muted')}
function slotCost(){return Math.round(420*Math.pow(1.9,Math.max(0,g.menuSlots-4)))}
function buyMenuSlot(){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}if(g.coins<slotCost()){toast('Not enough coins yet. Complete another ticket!');return;}g.coins-=slotCost();g.menuSlots++;save();render();toast('✨ New menu slot unlocked!')}
function openFoodItem(uid){const o=g.owned.find(x=>x.uid===uid);if(!o)return;const f=F(o.id),lc=foodLevelCost(o),fc=fusionFee(o);showModal(`${f.icon} ${f.name}`,`<div class="successbox" style="text-align:center;margin-bottom:13px"><div style="font-size:50px">${f.icon}</div>${rarityTag(f.rarity)}<h2 style="margin:8px">×${foodValue(o).toFixed(2)} food value</h2>Level ${o.level}/3 · Fusion ${o.fusion}/3</div><div class="btnrow" style="margin-bottom:10px"><button class="primary" ${o.level>=3?'disabled':''} onclick="upgradeFood(${uid})">${o.level>=3?'MAX LEVEL':`⬆ Level Up · ${fmt(lc)} 🪙`}</button><button class="secondary" ${g.completed<5||o.fusion>=3?'disabled':''} onclick="ingredientFusionInfo(${uid})">🧺 Fuse via ingredients</button><button class="secondary" ${g.completed<5||o.fusion>=3?'disabled':''} onclick="fuseDuplicate(${uid})">✦ Fuse duplicate · ${fmt(fc)} 🪙</button></div><div class="btnrow"><button class="tertiary" onclick="unassignFood(${uid})">Remove from active menu</button><button class="tertiary" onclick="sellFoodPrompt(${uid})">Sell food · ${fmt(resalePrice(o))} 🪙</button><button class="tertiary" onclick="openMenu()">All foods</button></div>`) }
function unassignFood(uid){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}g.activeMenu=g.activeMenu.filter(x=>x!==uid);save();render();closeModal();toast('Removed from menu. Food stays in your collection.')}
function chooseFoodForSlot(){const available=g.owned.filter(x=>!g.activeMenu.includes(x.uid));if(!available.length){showModal('Add to Menu',`<p>All your foods are already placed. Solve more tickets to collect new pastries!</p><button class="primary" onclick="closeModal()">OK</button>`);return;}showModal('➕ Add a food to your menu',`<p class="small muted">Choose a collected food. It will add its value to your bakery multiplier.</p><div class="modalgrid">${available.map(o=>`<button class="itemcard" onclick="assignFood(${o.uid})" style="cursor:pointer;text-align:center"><div style="font-size:40px">${F(o.id).icon}</div><b>${F(o.id).name}</b><div>${rarityTag(F(o.id).rarity)}</div><strong>×${foodValue(o).toFixed(2)}</strong></button>`).join('')}</div>`) }
function assignFood(uid){if(g.run){toast('Finish your current order before changing bakery upgrades.');return;}if(g.activeMenu.length>=g.menuSlots)return;const o=g.owned.find(x=>x.uid===uid);if(!o)return;g.activeMenu.push(uid);save();closeModal();toast(`${F(o.id).name} added to your menu!`)}
function renderMenu(){const items=g.activeMenu.map(uid=>g.owned.find(x=>x.uid===uid)).filter(Boolean);const grid=items.map(o=>{const f=F(o.id);return `<button class="food-tile r${f.rarity}" onclick="openFoodItem(${o.uid})" title="${f.name}: upgrade, fuse, or sell"><div class="tier-banner">✦ ${RARITIES[f.rarity].toUpperCase()} ${o.fusion?'· ★'.repeat(o.fusion):''}</div><div class="food-icon">${f.icon}</div><div class="food-name">${f.name}</div><div class="food-level">LV ${o.level}/3</div><div class="food-value">×${foodValue(o).toFixed(2)}</div></button>`}).join('');const empty=Array.from({length:Math.max(0,g.menuSlots-items.length)},()=>`<button class="food-tile empty" onclick="chooseFoodForSlot()"><div class="plus-mark">＋</div><div class="slot-help">Add Food</div></button>`).join('');return `<main class="panel menu-stage"><div class="menu-header"><div><h2 class="menu-title">🍞 Your Bakery Menu</h2><div class="menu-sub">Collect Filipino pastries, then grow their value!</div></div><button class="tertiary" onclick="openIndex()">📖 Collection Index</button></div><div class="value-hero"><div class="caption">✦ Total Bakery Multiplier ✦</div><div class="number">×${bakeryValue().toFixed(2)}</div><small>${items.length}/${g.menuSlots} menu slots filled · 🪙 ${fmt(g.coins)} coins</small></div><div class="menu-grid">${grid}${empty}<button class="food-tile buy-slot" onclick="buyMenuSlot()"><div class="plus-mark">⊕</div><strong>Buy Slot</strong><div class="slot-price">🪙 ${fmt(slotCost())}</div></button></div><div class="menu-footer"><button class="secondary" onclick="openMenu()">🍰 Manage & Upgrade Foods</button><button class="secondary" ${g.completed<2?'disabled':''} onclick="openKitchen()">🔥 Kitchen</button><button class="secondary" ${g.completed<4?'disabled':''} onclick="openDecor()">🌷 Decor</button></div><p class="small muted" style="text-align:center;margin-top:15px">Tap any food to upgrade it. Solve tickets on the right to find more!</p></main>`}
function renderV33Worksheet(){const r=g.run;return `<main class="panel v33-stage theme${Math.min(3,themeLevel())}"><div class="worksheet-actionline"><div><h2 style="margin:0;font-family:Georgia,serif">🧾 Order Worksheet</h2><div class="worksheet-info">${r.ticket.a} × ${r.ticket.b} · ${RARITIES[r.ticket.rarity]} order</div></div><div class="worksheet-controls"><button id="arrowToggle" aria-pressed="${g.tutorialArrows}" class="secondary mini" onclick="toggleArrows()">${g.tutorialArrows?'➜ Tutorial arrows ON':'➜ Tutorial arrows OFF'}</button><button id="sfxToggle" aria-pressed="${g.sound}" class="secondary mini" onclick="toggleSfx()">${g.sound?'🔊 Sounds ON':'🔈 Sounds OFF'}</button><button class="tertiary mini" onclick="abandonTicket()">✕ Exit</button></div></div>${r.phase==='failed'?`<div class=\"introbox\"><h2>💔 Out of lives</h2><p>Retry the ticket, or continue in Normal Mode.</p><div class=\"btnrow\"><button class=\"secondary\" onclick=\"retryRun()\" ${r.retriesLeft<=0?'disabled':''}>↻ Retry (${r.retriesLeft})</button><button class=\"primary\" onclick=\"retryNormal()\">Normal Mode</button></div></div>`:r.phase==='claim'?`<div class="introbox"><div class="introart">🏆</div><h2>Order complete!</h2><div class="value-hero" style="max-width:370px"><div class="caption">Pending Coins</div><div class="number">🪙 ${fmt(r.pool)}</div></div><p>${r.chests.length} treasure chest${r.chests.length===1?'':'s'} waiting!</p><button class="primary" onclick="prizeItems()">🎁 Collect Coins & Open Chests</button></div>`:`<iframe id="v33Frame" class="v33-frame" title="Original v33 long multiplication worksheet" sandbox="allow-scripts allow-same-origin"></iframe><div class="tutorial-step" id="bridgeStatus">${g.tutorialArrows?'Follow the animated arrows in the worksheet.':'Connect digits and solve at your own pace.'}</div>`}<div class="worksheet-prize" id="prizejar"><div><small>🏆 PENDING PRIZE POOL</small><div><strong id="pendingCoins">🪙 ${fmt(r.pool)}</strong> &nbsp; <strong id="pendingChests">🎁 ${r.chests.length}</strong></div></div><div><small>Temporary Luck</small><strong id="pendingLuck">✦ ${r.luck}</strong></div></div></main>`}
function handleV33Message(ev){const frame=$('v33Frame');if(!frame||ev.source!==frame.contentWindow||!ev.data||ev.data.source!=='bc-v33')return;const m=ev.data,r=g.run;if(!r)return;
 if(m.type==='ready'){sendEngine('start',{ticket:r.ticket});sendEngine('sound',{enabled:g.sound,volume:1});sendEngine('tutorial',{enabled:g.tutorialArrows});return}
 if(m.type==='started'){r.bridgeDone=0;r.bridgeSig='';return}
 if(m.type==='height'){let el=$('v33Frame');if(el)el.style.height= Math.max(570,Math.min(1030,Number(m.height||680)+12))+'px';return}
 if(m.type==='state'){
  if(r.phase!=='engine')return;
  const sig=[m.step,m.done,m.row,m.phase,m.errors,m.carryUp,m.carryDown].join('/');
  if(sig===r.bridgeSig)return;
  const old=r.bridgePrev||{};r.bridgeSig=sig;
  if(m.errors>Number(old.errors||0)){r.mistakes+=m.errors-Number(old.errors||0);g.learning.mistakes+=m.errors-Number(old.errors||0);if(r.mode==='survival'){r.livesLeft=Math.max(0,g.lives-Math.floor(r.mistakes/2));if(r.livesLeft===0){r.phase='failed';save();render();toast('Survival challenge ended. You can retry.');return;}}}
  if(m.done>r.bridgeDone){for(let i=r.bridgeDone;i<m.done;i++){const last=i===r.steps.length-1,step=r.steps[i]||r.steps.at(-1);const chance=clamp(.12+r.luck*.013+step.row*.03,.06,.83);if(Math.random()<chance||(last&&!r.chests.length)){const grade=rollChestRarity(r.ticket.rarity);r.chests.push({rarity:grade});r.luck=Math.round(r.luck*.3);toast(`${RARITIES[grade]} chest discovered! 🎁`)}}r.bridgeDone=m.done;r.correct+=Math.max(0,m.done-Number(old.done||0))*2;earnCoin(1.2,1);}
  else if(m.step!==old.step || m.carryUp>Number(old.carryUp||0)||m.carryDown>Number(old.carryDown||0)){
   earnCoin(m.carryUp>Number(old.carryUp||0)||m.carryDown>Number(old.carryDown||0)?1.2:.65,m.carryUp>Number(old.carryUp||0)||m.carryDown>Number(old.carryDown||0)?2:1);
  }
  if(m.bestCombo>r.bestStreak)r.bestStreak=m.bestCombo;
  r.bridgePrev={...m};r.index=Math.min(r.steps.length-1,m.done||0);
  const pc=$('pendingCoins'),pl=$('pendingLuck'),ph=$('pendingChests');if(pc)pc.textContent='🪙 '+fmt(r.pool);if(pl)pl.textContent='✦ '+r.luck;if(ph)ph.textContent='🎁 '+r.chests.length;
  const st=$('bridgeStatus');if(st)st.textContent=g.tutorialArrows?'Use the animated arrow for the next action.':'Tutorial arrows are off. Keep solving!';
  save();return;
 }
 if(m.type==='complete'){
  if(r.phase!=='engine')return;
  if(!r.chests.length)r.chests.push({rarity:rollChestRarity(r.ticket.rarity)});
  r.correct+=1;finishSum();
 }
}
window.addEventListener('message',handleV33Message);

function render(){refillBoard();$('app').innerHTML=`<header class="topbar"><div class="brand"><div class="brandlogo">🥖</div><div><h1>Panaderya Quest</h1><div class="tagline">Bake • Multiply • Grow</div></div></div><div class="topstats"><div class="statpill"><span class="ico">🏆</span><div><div class="label">Bakery Multiplier</div><div class="val num">×${bakeryValue().toFixed(2)}</div></div></div><div class="statpill"><span class="ico">🪙</span><div><div class="label">Coins</div><div class="val num" id="walletCoins">${fmt(g.coins)}</div></div></div><div class="statpill"><span class="ico">🎟️</span><div><div class="label">Ticket Luck</div><div class="val num">+${g.permanentLuck}</div></div></div><button class="iconbtn" onclick="openSettings()" title="Settings and tutorial">⚙️</button></div></header><div class="layout">${renderLeft()}${g.run?renderV33Worksheet():renderMenu()}${renderRight()}</div>`;if(g.run&&g.run.phase==='engine'){const fr=$('v33Frame');if(fr)fr.srcdoc=engineHTML()}}
setInterval(tickStaff,1000);refillBoard();render();if(!g.helpSeen)setTimeout(()=>showTutorial(0),400);save();
</script></body></html>
