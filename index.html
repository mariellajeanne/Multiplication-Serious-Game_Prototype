<div id="bakeryLoading" class="bakery-loading" role="region" aria-label="Loading the bakery" aria-busy="true">
 <div class="loading-center"><h1 id="loadingLabel">Loading…</h1><progress id="loadingProgress" value="0" max="1" aria-label="Bakery resource readiness"></progress><p id="loadingStatus" class="loading-status" role="status">Preparing your bakery</p></div>
 <button id="loadingSkip" class="loading-skip" type="button" disabled>Skip</button>
</div>
<main id="bakeryEnvironment" class="bakery-environment" aria-label="My Panaderya bakery interior" hidden></main>
<template id="environmentSceneTemplate">
 <div class="environment-architecture" aria-hidden="true"><picture><source media="(max-aspect-ratio: 3/2)" srcset="assets/environment/bakery-wall-tablet.webp"><img src="assets/environment/bakery-wall.webp" alt="" fetchpriority="high" decoding="async" draggable="false"></picture></div>
 <div class="environment-counter" aria-hidden="true"><picture><source media="(max-aspect-ratio: 3/2)" srcset="assets/environment/bakery-counter-tablet.webp"><img src="assets/environment/bakery-counter.webp" alt="" fetchpriority="high" decoding="async" draggable="false"></picture></div>
 <img class="environment-register" src="assets/environment/cash-register.webp" alt="" aria-hidden="true" decoding="async" draggable="false">
</template>
<div id="app" hidden inert></div><div id="modals" hidden inert></div><div id="notificationDock" class="notification-dock" hidden inert><div id="purchaseUndo" class="purchase-undo" role="status" hidden></div><div id="toasts" class="toaststack" aria-live="polite"></div></div>
<!-- Preserve classic-script dependency order in both playable views.
     ?view=environment keeps these inert and never touches game state. -->
<script>
// A missing bootstrap file must also offer recovery, before its loader can run.
window.addEventListener('error',event=>{
 if(!['src/bakery-assets.js','src/environment-entry.js'].includes(event.target?.getAttribute?.('src')))return;
 document.getElementById('loadingLabel').textContent='Let’s try again';
 document.getElementById('loadingStatus').textContent='The bakery could not load. Check your connection, then retry.';
 const retry=document.getElementById('loadingSkip');retry.textContent='Retry';retry.disabled=false;retry.onclick=()=>location.reload();
},true);
</script>
