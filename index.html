<script>
'use strict';
const $=(sel,root=document)=>root.querySelector(sel),$$=(sel,root=document)=>Array.from(root.querySelectorAll(sel));
const SAVE_KEY='batchcarry_v35_wireframe_standalone';
const TIER=[{name:'COMMON',min:1,max:3,color:'#a27d5b',mult:1},{name:'UNCOMMON',min:4,max:6,color:'#669077',mult:1.2},{name:'RARE',min:7,max:9,color:'#4385a6',mult:1.5},{name:'EPIC',min:10,max:12,color:'#9669b5',mult:2},{name:'LEGENDARY',min:13,max:16,color:'#cf8e32',mult:2.7},{name:'COSMIC',min:17,max:20,color:'#5675c7',mult:3.5},{name:'DIVINE',min:21,max:24,color:'#c965a7',mult:4.5},{name:'ETERNAL',min:25,max:25,color:'#aa4646',mult:6}];
// The source sketch overlaps at 13 and skips 20. We assign 13 to Legendary, 20 to Cosmic.
function tier(stars){return TIER.find(t=>stars>=t.min&&stars<=t.max)||TIER[0]}
const $num=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:1});
const CONFIGS=[[2,1],[2,2],[3,2],[3,3],[4,2],[5,2],[4,3],[4,4],[5,3],[3,6],[4,5],[7,3],[6,4],[5,5]];
const NAMES=['Morning Croissants','Butter Roll Batches','Cookie Tray Service','Afternoon Pastries','Cinnamon Swirl Boxes','Wedding Cake Portions','Cafe Bread Delivery','Festival Biscuit Crates','Midnight Bakery Order','Grand Patisserie Request','Wedding Reception Boxes','Buttercream Express','Honey Bun Cartons','Family Brioche Sets'];
const state={view:'hall',wallet:0,totalCoins:0,totalPacks:0,slots:2,presses:[],nextPress:2,display:0,delivery:0,gearBudget:0,tickets:[],ticketEnd:0,current:null,modal:null,sort:'revenue',filter:'all',search:'',mastery:1,completed:0,help:true,sfxVol:.65,musicVol:.16,reduced:false,notifications:[],lastTick:Date.now(),selectedSlot:null,comboState:null};
function load(){try{let obj=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(obj&&Array.isArray(obj.presses))Object.assign(state,obj)}catch(e){}if(!state.presses.length&&!state.completed){state.presses=[{id:'press-1',name:'Starter Sweet Roll Press',a:12,b:3,stars:2,rate:5,value:1,gear:0,slot:0,stats:{cycles:2,bestCombo:2,carryUp:0,carryDown:0,errors:0},starter:true}]}state.notifications=[];state.modal=null;state.current=null;state.view='hall';state.comboState=null;state.lastTick=Date.now();if(!state.tickets.length||Date.now()>=state.ticketEnd)rotateTickets(false)}
function save(){try{let x={...state,modal:null,current:null,notifications:[],comboState:null,view:'hall'};localStorage.setItem(SAVE_KEY,JSON.stringify(x))}catch(e){}}
function capStars(){return Math.min(25,Math.max(4,state.mastery+3+state.display*3+state.delivery*2))}
function generateTicket(i){let ceiling=capStars();let eligible=CONFIGS.filter(([a,b])=>a*b<=ceiling);let boost=Math.min(.9,.14+state.display*.12+state.delivery*.08);let cand;if(i===0){cand=eligible.reduce((best,p)=>Math.abs(p[0]*p[1]-Math.min(ceiling,state.mastery+2))<Math.abs(best[0]*best[1]-Math.min(ceiling,state.mastery+2))?p:best,eligible[0])}else{let ranked=eligible.slice().sort((a,b)=>a[0]*a[1]-b[0]*b[1]);let ix=Math.floor(Math.pow(Math.random(),Math.random()<boost?.45:1.7)*ranked.length);cand=ranked[Math.min(ranked.length-1,ix)]}let [a,b]=cand;const makeN=n=>n===1?1+Math.floor(Math.random()*9):(10**(n-1)+Math.floor(Math.random()*8*10**(n-1)));let v1=makeN(a),v2=makeN(b);let stars=a*b;return{id:`T${Date.now()}-${i}-${Math.random().toString(36).slice(2,6)}`,title:NAMES[(i+Math.floor(Math.random()*NAMES.length))%NAMES.length],a:v1,b:v2,stars,icon:['🥐','🍞','🧁','🥯','🍪','🎂'][i%6]}}
function rotateTickets(announce=true){state.tickets=Array.from({length:6},(_,i)=>generateTicket(i));state.ticketEnd=Date.now()+180000;if(announce){const best=[...state.tickets].sort((a,b)=>b.stars-a.stars)[0];notice(`🎟️ Fresh order tickets arrived! ${tier(best.stars).name} ${best.stars}★ is available.`,9000)}save()}
function rate(m){return m.rate*(1+(m.gear||0)*.25)}function sellRate(m){return rate(m)*m.value}function totals(){let packed=0,coins=0;for(let p of state.presses)if(p.slot!==null&&p.slot!==undefined){packed+=rate(p);coins+=sellRate(p)}return{packed,coins}}
function economy(){let now=Date.now(),sec=Math.min(5,Math.max(0,(now-state.lastTick)/1000));state.lastTick=now;let t=totals();state.wallet+=t.coins*sec;state.totalCoins+=t.coins*sec;state.totalPacks+=t.packed*sec}
function notifierRemove(id){state.notifications=state.notifications.filter(n=>n.id!==id);drawNotices()}
let lastNotice=1;function notice(message,duration=8500){let id=lastNotice++;state.notifications.unshift({id,message,duration,created:Date.now()});state.notifications=state.notifications.slice(0,4);drawNotices();window.setTimeout(()=>notifierRemove(id),duration);beep(720)}
function drawNotices(){let zone=$('#notices');if(!zone)return;zone.innerHTML=state.notifications.map(n=>`<div class="notice" style="--ttl:${n.duration}ms"><span>${esc(n.message)}</span><button data-dismiss="${n.id}" aria-label="Dismiss">×</button></div>`).join('');$$('[data-dismiss]',zone).forEach(b=>b.onclick=()=>notifierRemove(+b.dataset.dismiss))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function counterStack(kind){if(kind==='packs')return `<div class="counter-stack"><div class="counter"><b data-packs-rate>0 📦/s</b><small>PACKS PER SECOND</small></div><div class="counter"><b data-packs-total>0 📦</b><small>TOTAL MADE · SOLD AUTOMATICALLY</small></div></div>`;return `<div class="counter-stack"><div class="counter"><b data-coins-rate>0 🪙/s</b><small>COINS PER SECOND</small></div><div class="counter"><b data-wallet>0 🪙</b><small>COINS COLLECTED · SPENDABLE</small></div></div>`}
function header(){return `<header class="stat-header">${counterStack('packs')}<div class="brand"><strong>🥐 Batch &amp; Carry</strong><span>The Bakery Packing Hall</span></div>${counterStack('coins')}</header>`}
function ticketCard(t){const r=tier(t.stars);return `<button type="button" class="ticket" data-ticket="${t.id}" style="--tier:${r.color}" aria-label="Train ${esc(t.title)} ${t.a} times ${t.b}, ${t.stars} stars ${r.name}"><span class="ticket-title">${esc(t.title)}</span><span class="ticket-math">🎂 ${$num(t.a)} × 📦 ${$num(t.b)}</span><span class="ticket-meta">★ ${t.stars} · ${r.name}</span><span class="ticket-bonus">Package value ×${r.mult.toFixed(2)} · ${String(t.a).length} × ${String(t.b).length} digits</span></button>`}
function ticketPanel(){return `<aside class="ticket-panel"><div class="ticket-heading"><h2>ORDER TICKETS</h2><small>Resets in <b data-clock>03:00</b></small></div><div class="ticket-stack">${state.tickets.map(ticketCard).join('')}</div><div class="ticket-refresh">🎟️ 6 new tickets every 3 minutes · Difficulty & rarity follow the number of digit pairs</div></aside>`}
function machineRow(slot){let p=state.presses.find(x=>x.slot===slot);let r=p?tier(p.stars):null;let cnt=p?Math.min(7,2+Math.floor(p.stars/4)+(p.gear||0)):0;let coinCount=p?Math.min(5,2+Math.floor(p.stars/7)+(p.gear||0)):0;return `<div class="lane"><div class="machine ${p?'':'art-empty'}">${p?`<div class="packer-art"><span class="rarity-pill" style="color:${r.color}">${p.stars}★ ${r.name}</span><span class="machine-emoji">⚙️</span><small style="font-size:9px">GEAR +${p.gear||0}</small></div><div class="machine-text"><strong title="${esc(p.name)}">${esc(p.name)}</strong><div class="speed">${$num(rate(p))} 📦/s</div><div class="meta">${$num(p.value)} 🪙/pack</div><button class="details-btn" data-press="${p.id}">DETAILS</button></div>`:`<button class="empty-packer" style="background:transparent;border:0" data-pick-slot="${slot}"><b>＋</b><span>Empty purchased slot ${slot+1}<br><small>Choose an Auto-Packer</small></span></button>`}</div><div class="belt" style="--track:170px">${p?Array.from({length:cnt},(_,i)=>`<span class="parcel" style="--delay:${(-i*3.6/cnt).toFixed(2)}s;--travel:3.6s">📦</span>`).join(''):''}</div><div class="register"><span class="register-icon">🧾</span><strong>${p?$num(sellRate(p))+' 🪙/s':'REGISTER'}</strong><small>${p?'AUTO-SELLING':'READY'}</small></div><div class="branch">${p?Array.from({length:coinCount},(_,i)=>`<span class="coin-fly" style="--delay:${(-i/coinCount).toFixed(2)}s">🪙<span class="coin-tally">+${$num(sellRate(p)/coinCount)}</span></span>`).join(''):''}</div></div>`}
function hall(){return `<main class="hall-grid"><section class="frame features">${header()}<div class="hall-inner"><div class="hall-heading"><h2>🍞 Packing Hall</h2><span class="tiny">${state.presses.filter(x=>x.slot!==null).length}/${state.slots} stations operating</span></div><div class="lane-field"><div class="collector-link"></div><div class="pipe-main">${Array.from({length:Math.min(7,Math.max(3,Math.floor(totals().coins/90)+2))},(_,i)=>`<span class="riser" style="--delay:-${(i*4/6).toFixed(2)}s">🪙</span>`).join('')}</div>${Array.from({length:state.slots},(_,i)=>machineRow(i)).join('')}</div><button class="unlock-slot" id="slotBuy">＋ 1 PACKING STATION <small>🪙 ${$num(slotCost())} · adds a belt and cash register</small></button><div class="shop-strip"><span>📦 Each package travels to its register, is sold, then earns coins.</span><button class="btn small" data-modal="shop">⚙ Upgrade shop</button></div><div class="notifications" id="notices"></div></div><footer class="toolbar"><button class="btn primary" data-modal="inventory">🎒 AUTO-PACKERS</button><span class="tiny">EQUIPPED ${state.presses.filter(p=>p.slot!==null).length}/${state.slots}</span><button class="btn small" id="equipBest">AUTO-EQUIP BEST</button><button class="btn small" id="unequipAll">UNEQUIP ALL</button><span class="gap"></span><button class="btn small" data-modal="settings">⚙ SETTINGS</button></footer></section>${ticketPanel()}</main>`}
function worksheet(){let t=state.current||{title:'Order',a:48,b:6,stars:2};let r=tier(t.stars),c=state.comboState||{};let steps=[['Connect','connect'],['Multiply','fact'],['Position','place'],['Add Carry','applyCarry'],['Transfer Carry','liftCarry']];const seq=['connect','fact','place','applyCarry','liftCarry','rowFinish','shift','addDigit','addCarry','result'];let stage=seq.indexOf(c.step||'connect');let active=steps.findIndex(x=>x[1]===c.step);return `<section class="worksheet-outer"><div class="work-topbar"><button class="btn" id="backHall">← BACK TO HALL</button><span class="tiny">TRAIN A PACKING PRESS · original v3 worksheet interactions</span><button class="btn" data-modal="settings">⚙ SETTINGS</button></div><div class="worksheet-header">${counterStack('packs')}<div class="brand"><strong>🥐 Batch &amp; Carry</strong><span>Production Worksheet</span></div>${counterStack('coins')}</div><div class="worksheet-cols"><aside class="work-sidebar"><h3>🍪 Packing Cycle</h3><div><span class="combo-big" id="comboNumber">${c.combo||0}×</span><span class="tiny"> Combo</span><div class="progress-line"><div id="comboProgress" style="width:${c.step==='connect'?0:Math.min(100,Math.max(5,stage/5*100))}%"></div></div><div class="tiny">One cycle = connect, retrieve, place, and any required carry actions</div></div><div class="step-list" id="cycleChecklist">${steps.map(([name,key],i)=>`<div class="step-line"><span class="tick ${active>i?'yes':''}">${active>i?'✓':''}</span>${name}</div>`).join('')}</div><div class="side-stat">↟ Carries transferred <b id="carryUp">${c.carryUp||0}</b></div><div class="side-stat">↡ Carries added <b id="carryDown">${c.carryDown||0}</b></div><div class="side-stat">≡ Row <b id="rowNo">${(c.row||0)+1}</b></div><div class="side-stat">Best row combo <b id="bestCombo">${c.bestCombo||0}</b></div><div class="side-stat">Fact lookups <b id="factLookups">${c.factLookups||0}</b></div><div class="side-stat">Memory recalls <b id="factRecalls">${c.factRecalls||0}</b></div></aside><main class="work-center"><div style="display:flex;justify-content:space-between;gap:8px;padding:2px 0 9px"><b>✍️ PACKING RECEIPT</b><button class="btn small" id="restartWorksheet">↻ Restart</button></div><iframe id="engineFrame" class="engine-iframe" title="Original v3 interactive multiplication worksheet" loading="eager"></iframe></main><aside class="ticket-detail"><h3>🎟️ Ticket details</h3><div style="font-weight:900;color:${r.color}">${t.stars}★ ${r.name}</div><p><strong>${esc(t.title)}</strong></p><div class="large-order">${$num(t.a)} × ${$num(t.b)}</div><div class="detail-copy">${String(t.a).length} multiplicand digits × ${String(t.b).length} multiplier digits. Arrange the longer factor on top for fewer rows.</div><div class="detail-row">Potential digit links <b>${t.stars}</b></div><div class="detail-row">Selling value multiplier <b>×${r.mult.toFixed(2)}</b></div><div class="detail-row">Potential row combo <b>${Math.max(String(t.a).length,String(t.b).length)}</b></div><div class="detail-row">Expected total <b>?</b></div><p class="inline-note">Complete the original v3 connecting, multiplication-table tapping, whole-tile positioning and carry-swipe sequence.</p></aside></div></section>`}
function showScreen(){const a=$('#app');a.innerHTML=state.view==='worksheet'?worksheet():hall();drawNotices();updateCounters();wire();if(state.view==='worksheet')setupFrame()}
function updateCounters(){let t=totals();$$('[data-packs-rate]').forEach(e=>e.textContent=`${$num(t.packed)} 📦/s`);$$('[data-packs-total]').forEach(e=>e.textContent=`${$num(Math.floor(state.totalPacks))} 📦`);$$('[data-coins-rate]').forEach(e=>e.textContent=`${$num(t.coins)} 🪙/s`);$$('[data-wallet]').forEach(e=>e.textContent=`${$num(Math.floor(state.wallet))} 🪙`);$$('[data-clock]').forEach(e=>e.textContent=timeRemaining(state.ticketEnd-Date.now()))}
function timeRemaining(ms){let x=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`}
function slotCost(){return Math.round(180*Math.pow(2.4,Math.max(0,state.slots-2)))}
function buySlot(){let c=slotCost();if(state.wallet<c)return notice('Not enough coins to buy the next Packing Station.');state.wallet-=c;state.slots++;notice(`✅ Packing Station ${state.slots} added with conveyor and register!`);save();showScreen()}
function equipBest(){let list=[...state.presses].sort((a,b)=>sellRate(b)-sellRate(a));list.forEach((p,i)=>p.slot=i<state.slots?i:null);notice('⚙️ Strongest Auto-Packers equipped by coins/s.');beep(550);save();showScreen()}
function unequipAll(){state.presses.forEach(p=>p.slot=null);notice('All Auto-Packers returned safely to inventory.');save();showScreen()}
function chooseTicket(id){let t=state.tickets.find(x=>x.id===id);if(!t)return;state.current={...t};state.comboState=null;state.view='worksheet';showScreen();beep(500)}
function setupFrame(){let f=$('#engineFrame');if(!f)return;f.srcdoc=window.ORIGINAL_V3_HTML;}
function upgradeCost(kind){let lvl=state[kind]||0;return Math.round((kind==='display'?420:630)*Math.pow(2.15,lvl))}
function purchaseUpgrade(kind){let cost=upgradeCost(kind);if(state.wallet<cost)return notice('More coins required for this upgrade.');state.wallet-=cost;state[kind]++;notice(`${kind==='display'?'✨ Display counter':'🚚 Delivery service'} upgraded to level ${state[kind]}!`);save();renderModal()}
function upgradeGear(id){let p=state.presses.find(x=>x.id===id);if(!p)return;let cost=Math.round(250*Math.pow(2,p.gear||0));if(state.wallet<cost)return notice('Not enough coins to install that gear.');if((p.gear||0)>=5)return notice('Maximum drive gear reached.');state.wallet-=cost;p.gear++;notice(`⚙️ ${p.name}: +25% of base packing speed per gear level.`);save();renderModal()}
function equipMachine(id){let p=state.presses.find(x=>x.id===id);if(!p)return;let slot=state.selectedSlot;let occupied=state.presses.filter(x=>x.slot!==null).map(x=>x.slot);if(slot===null||slot===undefined)slot=Array.from({length:state.slots},(_,i)=>i).find(i=>!occupied.includes(i));if(slot===undefined){let weakest=state.presses.filter(x=>x.slot!==null).sort((a,b)=>sellRate(a)-sellRate(b))[0];slot=weakest?.slot??0}state.presses.forEach(x=>{if(x.slot===slot)x.slot=null});p.slot=slot;state.selectedSlot=null;notice(`📦 ${p.name} equipped at station ${slot+1}.`);save();showScreen();renderModal()}
function unequipMachine(id){let p=state.presses.find(x=>x.id===id);if(p)p.slot=null;save();showScreen();renderModal()}
function sellMachine(id){let p=state.presses.find(x=>x.id===id);if(!p||!confirm(`Sell ${p.name}? This cannot be undone.`))return;state.wallet+=Math.round(sellRate(p)*6);state.presses=state.presses.filter(x=>x.id!==id);save();showScreen();renderModal()}
function removeModal(){state.modal=null;$('#modalRoot').innerHTML=''}
function openModal(which){state.modal=which;renderModal()}
function modalWrapper(title,body,small=false){return `<div class="modal-backdrop" id="modalBackdrop"><section class="modal ${small?'narrow':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" id="closeModal">×</button></div>${body}</section></div>`}
function inventoryBody(){let list=state.presses.filter(p=>{let q=state.search.toLowerCase();return(!q||p.name.toLowerCase().includes(q)||`${p.a} ${p.b}`.includes(q))&&(state.filter==='all'||state.filter==='equipped'&&p.slot!==null||state.filter==='stored'&&p.slot===null)});list.sort((a,b)=>state.sort==='speed'?rate(b)-rate(a):state.sort==='rarity'?b.stars-a.stars:state.sort==='newest'?Number(b.id.split('-').pop())-Number(a.id.split('-').pop()):sellRate(b)-sellRate(a));return `<div class="inventory-filters"><input id="inventorySearch" placeholder="Search by name or problem" value="${esc(state.search)}"/><select id="inventorySort"><option value="revenue" ${state.sort==='revenue'?'selected':''}>Sort: coins/s</option><option value="speed" ${state.sort==='speed'?'selected':''}>Sort: packs/s</option><option value="rarity" ${state.sort==='rarity'?'selected':''}>Sort: rarity</option><option value="newest" ${state.sort==='newest'?'selected':''}>Sort: newest</option></select><select id="inventoryFilter"><option value="all" ${state.filter==='all'?'selected':''}>All Auto-Packers</option><option value="equipped" ${state.filter==='equipped'?'selected':''}>Equipped</option><option value="stored" ${state.filter==='stored'?'selected':''}>Unequipped</option></select></div><div class="inventory-list">${list.length?list.map(p=>{let r=tier(p.stars);return `<div class="inventory-row"><div><b>⚙ ${esc(p.name)}</b><div class="inline-note">${$num(p.a)} × ${$num(p.b)} · <span style="color:${r.color}">${p.stars}★ ${r.name}</span> · ${p.slot!==null?'Station '+(p.slot+1):'Stored'}</div><b>${$num(rate(p))} 📦/s · ${$num(sellRate(p))} 🪙/s</b></div><div class="inventory-actions"><button class="btn" data-details="${p.id}">DETAILS</button><button class="btn" data-gear="${p.id}">⚙+ Gear 🪙${$num(250*2**(p.gear||0))}</button><button class="btn primary" data-equip="${p.id}">${p.slot===null?'EQUIP':'MOVE'}</button>${p.slot!==null?`<button class="btn" data-unequip="${p.id}">UNEQUIP</button>`:''}</div></div>`}).join(''):'<p>No matching Auto-Packers. Solve an order ticket to earn one.</p>'}</div><p class="inline-note">Inventory is a popup; conveyors and coin tubes keep running behind it. Machines are never destroyed by unequipping.</p>`}
function shopBody(){return `<div class="shop-grid"><div class="shop-card"><b>🪟 Display Counter · Level ${state.display}</b><p>Attracts more demanding customers and makes higher-star order tickets more likely on each refresh. Boosts available tier range by +3 stars per level.</p><button class="btn primary" data-upgrade="display">UPGRADE · 🪙${$num(upgradeCost('display'))}</button></div><div class="shop-card"><b>🚚 Delivery Vehicle · Level ${state.delivery}</b><p>Expands delivery reach and improves the chance of higher-tier tickets. Boosts available tier range by +2 stars per level.</p><button class="btn primary" data-upgrade="delivery">UPGRADE · 🪙${$num(upgradeCost('delivery'))}</button></div><div class="shop-card"><b>⚙ Individual Press Drive Gears</b><p>Install gears from Auto-Packer inventory. Each gear adds 25% of that machine's original packs/s.</p><button class="btn" data-open="inventory">OPEN AUTO-PACKERS</button></div><div class="shop-card"><b>🏗️ Packing Stations · ${state.slots} built</b><p>Each new station includes a packaging conveyor, cash register and connection to the main coin pipe.</p><button class="btn primary" data-buy-slot>＋ SLOT · 🪙${$num(slotCost())}</button></div></div><p class="inline-note">All machines sell completed packages automatically. The four header counters show production rate, total produced, revenue rate, and spendable coins separately.</p>`}
function settingsBody(){return `<div class="vol-row"><b>🔊 Sound effects</b><input id="sfxVol" type="range" min="0" max="1" step=".05" value="${state.sfxVol}"><span id="sfxText">${Math.round(state.sfxVol*100)}%</span></div><div class="vol-row"><b>🎵 Ambient music</b><input id="musicVol" type="range" min="0" max="1" step=".05" value="${state.musicVol}"><span id="musicText">${Math.round(state.musicVol*100)}%</span></div><div class="vol-row"><label><input type="checkbox" id="reduceMotion" ${state.reduced?'checked':''}> Reduce conveyor animations</label></div><p class="inline-note">These settings are saved on this device. Sound effects include the original v3 digit-connecting, stamping, and carry-swiping sounds.</p><button class="btn" id="closeSettings">Done</button>`}
function detailsBody(p){let r=tier(p.stars);return `<p><b>${esc(p.name)}</b> · <span style="color:${r.color}">${p.stars}★ ${r.name}</span></p><div class="detail-row">Original problem <b>${$num(p.a)} × ${$num(p.b)}</b></div><div class="detail-row">Machine base speed <b>${$num(p.rate)} packs/s</b></div><div class="detail-row">Gear bonus (${p.gear||0}) <b>×${(1+(p.gear||0)*.25).toFixed(2)}</b></div><div class="detail-row">Current speed <b>${$num(rate(p))} packs/s</b></div><div class="detail-row">Ticket multiplier <b>×${r.mult.toFixed(2)}</b></div><div class="detail-row">Value per pack <b>${$num(p.value)} coins</b></div><div class="detail-row">Income <b>${$num(sellRate(p))} coins/s</b></div><div class="detail-row">Best row combo <b>${p.stats?.bestCombo||0}</b></div><div class="detail-row">Correct cycles <b>${p.stats?.cycles||0}</b></div><div class="detail-row">Carries transferred / added <b>${p.stats?.carryUp||0} / ${p.stats?.carryDown||0}</b></div><div class="detail-row">Corrected errors <b>${p.stats?.errors||0}</b></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" data-equip="${p.id}">${p.slot===null?'EQUIP':'MOVE'}</button><button class="btn" data-gear="${p.id}">⚙ Upgrade gear</button>${!p.starter?`<button class="btn" data-sell="${p.id}">Sell</button>`:''}<button class="btn" data-open="inventory">Back to inventory</button></div>`}
function computeCertification(t,stats,top,bottom){const stars=t.stars,r=tier(stars),best=stats.bestCombo||0,up=stats.carryUp||0,down=stats.carryDown||0,base=5+stars*1.6+best*3.2+up*1.1+down*.8;let acc=Math.max(.75,1-(stats.errors||0)*.04),eff=String(top).length>=String(bottom).length?1:.9,tempo=Math.min(1.06,stats.tempo||1);let rateN=Math.round(base*(1+(best/Math.max(1,Math.max(String(top).length,String(bottom).length)))*.10)*acc*eff*tempo*10)/10;let value=Number((r.mult).toFixed(2));return{stars,base,rate:rateN,value,acc,eff,tempo,comboBonus:1+best/Math.max(1,Math.max(String(top).length,String(bottom).length))*.10,stats}}
function certificationBody(){let data=state.lastCertification;if(!data)return'';let {t,cal,press}=data;return `<p>🎉 You trained a new <b>${tier(t.stars).name} Auto-Packer</b> by completing the original v3 long multiplication worksheet!</p><div class="result-rate">${$num(press.rate)} 📦/s</div><div class="detail-row">Problem <b>${$num(t.a)} × ${$num(t.b)} = ${$num(t.a*t.b)}</b></div><div class="detail-row">Base: 5 + (${cal.stars} links × 1.6) + (${cal.stats.bestCombo} best combo × 3.2) + carries <b>${$num(cal.base)} packs/s</b></div><div class="detail-row">Row combo multiplier <b>×${cal.comboBonus.toFixed(2)}</b></div><div class="detail-row">Correctness <b>×${cal.acc.toFixed(2)}</b></div><div class="detail-row">Setup efficiency <b>×${cal.eff.toFixed(2)}</b></div><div class="detail-row">Fluency (small bonus) <b>×${cal.tempo.toFixed(2)}</b></div><div class="detail-row">${tier(t.stars).name} class selling value <b>×${tier(t.stars).mult.toFixed(2)} coins/pack</b></div><div class="detail-row">Final income before gears <b>${$num(press.rate*press.value)} 🪙/s</b></div><div class="detail-row">Stored in <b>${press.slot===null?'Inventory — all slots occupied':'Packing Station '+(press.slot+1)}</b></div><div class="inline-note" style="margin-top:10px">${cal.stats.lookup||0} multiplication-table lookups · ${cal.stats.recall||0} recalled from memory. Retrieval assistance is not penalized.</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="btn" id="continueOrders">Continue orders</button><button class="btn primary" id="viewHall">View Packing Hall</button></div>`}
function renderModal(){if(!state.modal){$('#modalRoot').innerHTML='';return}let m=state.modal;let content,title;if(m==='inventory'){title='🎒 AUTO-PACKERS';content=inventoryBody()}else if(m==='shop'){title='🛒 PACKING HALL UPGRADES';content=shopBody()}else if(m==='settings'){title='⚙ SETTINGS';content=settingsBody()}else if(m==='certification'){title='✨ AUTO-PACKER CERTIFIED';content=certificationBody()}else if(m.startsWith('detail:')){let p=state.presses.find(p=>p.id===m.slice(7));title='📋 AUTO-PACKER DETAILS';content=p?detailsBody(p):'<p>Machine not found</p>'}else return;$('#modalRoot').innerHTML=modalWrapper(title,content,m==='settings'||m.startsWith('detail:'));let c=$('#closeModal');if(c)c.onclick=removeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop'&&m!=='certification')removeModal()};
$$('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));$$('[data-details]').forEach(b=>b.onclick=()=>openModal('detail:'+b.dataset.details));$$('[data-gear]').forEach(b=>b.onclick=()=>upgradeGear(b.dataset.gear));$$('[data-equip]').forEach(b=>b.onclick=()=>equipMachine(b.dataset.equip));$$('[data-unequip]').forEach(b=>b.onclick=()=>unequipMachine(b.dataset.unequip));$$('[data-sell]').forEach(b=>b.onclick=()=>sellMachine(b.dataset.sell));$$('[data-upgrade]').forEach(b=>b.onclick=()=>purchaseUpgrade(b.dataset.upgrade));$$('[data-buy-slot]').forEach(b=>b.onclick=()=>{buySlot();renderModal()});
if($('#inventorySearch'))$('#inventorySearch').oninput=e=>{state.search=e.target.value;let pos=e.target.selectionStart;renderModal();let inp=$('#inventorySearch');inp?.focus();inp?.setSelectionRange(pos,pos)};
if($('#inventorySort'))$('#inventorySort').onchange=e=>{state.sort=e.target.value;renderModal()};if($('#inventoryFilter'))$('#inventoryFilter').onchange=e=>{state.filter=e.target.value;renderModal()};
if($('#sfxVol'))$('#sfxVol').oninput=e=>{state.sfxVol=+e.target.value;$('#sfxText').textContent=Math.round(state.sfxVol*100)+'%';let frame=$('#engineFrame');frame?.contentWindow?.postMessage({source:'bc-shell',type:'sound',enabled:state.sfxVol>0,volume:state.sfxVol},'*');save()};
if($('#musicVol'))$('#musicVol').oninput=e=>{state.musicVol=+e.target.value;$('#musicText').textContent=Math.round(state.musicVol*100)+'%';save()};
if($('#reduceMotion'))$('#reduceMotion').onchange=e=>{state.reduced=e.target.checked;document.body.classList.toggle('reduced-motion',state.reduced);save()};if($('#closeSettings'))$('#closeSettings').onclick=removeModal;
if($('#viewHall'))$('#viewHall').onclick=()=>{removeModal();state.view='hall';state.current=null;showScreen()};if($('#continueOrders'))$('#continueOrders').onclick=()=>{removeModal();state.view='hall';state.current=null;showScreen();document.querySelector('.ticket-panel')?.scrollIntoView({behavior:'smooth',block:'start'})};}
function wire(){$$('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));$$('[data-ticket]').forEach(b=>b.onclick=()=>chooseTicket(b.dataset.ticket));$$('[data-press]').forEach(b=>b.onclick=()=>openModal('detail:'+b.dataset.press));$$('[data-pick-slot]').forEach(b=>b.onclick=()=>{state.selectedSlot=+b.dataset.pickSlot;openModal('inventory')});if($('#slotBuy'))$('#slotBuy').onclick=buySlot;if($('#equipBest'))$('#equipBest').onclick=equipBest;if($('#unequipAll'))$('#unequipAll').onclick=unequipAll;if($('#backHall'))$('#backHall').onclick=()=>{if(confirm('Leave the current worksheet? Its unfinished calculation will not be saved.')){state.view='hall';state.current=null;showScreen()}};if($('#restartWorksheet'))$('#restartWorksheet').onclick=()=>{if(confirm('Restart this multiplication problem?'))$('#engineFrame')?.contentWindow?.postMessage({source:'bc-shell',type:'restart'},'*')}}
function updateSidebar(c){let p=$('#comboNumber');if(!p)return;p.textContent=(c.combo||0)+'×';$('#bestCombo').textContent=c.bestCombo||0;$('#carryUp').textContent=c.carryUp||0;$('#carryDown').textContent=c.carryDown||0;$('#rowNo').textContent=(c.row||0)+1;$('#factLookups').textContent=c.factLookups||0;$('#factRecalls').textContent=c.factRecalls||0;const phases=['connect','fact','place','applyCarry','liftCarry'];let ix=phases.indexOf(c.step);let between=['rowFinish','shift','addDigit','addCarry'].includes(c.step);let progress=ix<0?(between?100:0):ix*20;$('#comboProgress').style.width=progress+'%';$('#cycleChecklist').innerHTML=phases.map((ph,i)=>{let optional=i>=3;if(ix===4&&i===3&&!c.hadOld)return `<div class="step-line"><span class="tick na">—</span>${['Connect','Multiply','Position','Add Carry','Transfer Carry'][i]} (not needed)</div>`;let done=ix>i||between;let na=optional&&between;return `<div class="step-line"><span class="tick ${na?'na':done?'yes':''}">${na?'—':done?'✓':''}</span>${['Connect','Multiply','Position','Add Carry','Transfer Carry'][i]}</div>`}).join('')}
function finishTicket(msg){let t=state.current;if(!t||t.id!==msg.ticket.id)return;let stats=msg.stats||{};let cal=computeCertification(t,stats,msg.top,msg.bottom);let used=state.presses.filter(p=>p.slot!==null).map(p=>p.slot);let slot=Array.from({length:state.slots},(_,i)=>i).find(i=>!used.includes(i));let p={id:'press-'+(state.nextPress++),name:t.title,a:t.a,b:t.b,stars:t.stars,rate:cal.rate,value:cal.value,gear:0,slot:slot===undefined?null:slot,stats};state.presses.push(p);state.completed++;state.mastery=Math.max(state.mastery,t.stars);state.tickets=state.tickets.filter(x=>x.id!==t.id);state.tickets.push(generateTicket(5));state.lastCertification={t,cal,press:p};save();notice(`🥐 ${t.title} certified! ${$num(p.rate)} packs/s · ${tier(t.stars).name}`);beep(800);openModal('certification')}
window.addEventListener('message',e=>{if(e.source!==$('#engineFrame')?.contentWindow||!e.data||e.data.source!=='bc-v3')return;let m=e.data;if(m.type==='ready'&&state.current){$('#engineFrame').contentWindow.postMessage({source:'bc-shell',type:'start',ticket:state.current},'*');$('#engineFrame').contentWindow.postMessage({source:'bc-shell',type:'sound',enabled:state.sfxVol>0,volume:state.sfxVol},'*')}if(m.type==='state'&&state.view==='worksheet'){state.comboState=m;updateSidebar(m)}if(m.type==='complete'){finishTicket(m)}});
let ac=null;function beep(freq=600){if(state.sfxVol<=0)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const osc=ac.createOscillator(),gain=ac.createGain();osc.type='triangle';osc.frequency.value=freq;gain.gain.value=.025*state.sfxVol;osc.connect(gain);gain.connect(ac.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.12);osc.stop(ac.currentTime+.13)}catch(e){}}
function init(){load();document.body.classList.toggle('reduced-motion',state.reduced);showScreen();setInterval(()=>{economy();updateCounters();if(Date.now()>state.ticketEnd){rotateTickets(true);if(state.view==='hall')showScreen()}if(!state._lastSaved||Date.now()-state._lastSaved>4500){save();state._lastSaved=Date.now()}},250)}init();
</script></body></html>
