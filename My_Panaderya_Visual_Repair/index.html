<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6e3c27">
  <title>My Panaderya — Illustrated Bakery</title>
  <link rel="icon" href="assets/bakers-sparkle.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="viewport"><main id="stage" aria-label="My Panaderya interactive illustrated bakery prototype">
  <img class="stage-background" src="assets/bakery-room.png" alt="" draggable="false" fetchpriority="high">
  <img class="register-art" src="assets/cash-register.png" alt="" draggable="false">
  <img id="title-sign" src="assets/title-sign.png" alt="My Panaderya" draggable="false">
  <section id="package-station" aria-label="Boutique package display">
    <button class="alcove-hit" type="button" data-action="packages" aria-label="Open the packages boutique"></button>
    <button id="packages-plaque" type="button" class="picture-button" data-action="packages" aria-label="Open packages"><img src="assets/packages-entry-button.png" alt="Packages" draggable="false"></button>
  </section>
  <section id="menu-cabinet" aria-label="Equipped Filipino bakery food showcase">
    <img class="cabinet-art" src="assets/cabinet-wood.png" alt="" draggable="false">
    <header class="cabinet-header">
      <img id="menu-heading-global" src="assets/menu-heading.png" alt="Menu Collection" draggable="false">
      <button class="boost-status" id="boost-status" type="button" data-action="collection" aria-label="Baker's Boost multiplier; open collection">
        <img class="boost-panel-bg" src="assets/boost-chip-bg.png" alt="" draggable="false">
        <img class="boost-star" src="assets/bakers-sparkle.png" alt="" draggable="false">
        <span class="boost-copy"><span class="boost-caption">BAKER'S BOOST</span><span id="boost-value" class="boost-number">×0.00</span></span>
      </button>
    </header>
    <div id="cabinet-inner">
      <div id="cabinet-scroll" tabindex="0" aria-label="Scroll equipped foods"><div id="cabinet-grid"></div></div>
      <div class="art-scroll" id="cabinet-scrollbar">
        <img class="rail-image" src="assets/scroll-rail-clean.png" alt="" draggable="false">
        <button class="scroll-end scroll-top" type="button" data-action="food-up" aria-label="Scroll foods up"></button>
        <div class="scroll-track" id="cabinet-track"><img class="scroll-thumb" id="cabinet-thumb" src="assets/scroll-thumb-clean.png" alt="" draggable="false" role="scrollbar" tabindex="0" aria-label="Food scroll position" aria-controls="cabinet-scroll" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        <button class="scroll-end scroll-bottom" type="button" data-action="food-down" aria-label="Scroll foods down"></button>
      </div>
    </div>
  </section>
  <section id="orders-board" aria-label="Bakery order clipboard">
    <img class="board-frame" src="assets/clipboard-wood.png" alt="" draggable="false">
    <h2 class="board-title"><svg viewBox="0 0 36 42" aria-hidden="true"><path d="M10 8H5v31h27V8h-6M12 4h12v9H12zM10 21h4m4 0h9M10 28h4m4 0h9M10 34h4m4 0h9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Orders</span></h2>
    <div class="board-paper-scroller" id="order-scroller" tabindex="0" aria-label="Scroll orders"><div id="order-items"></div></div>
    <div class="board-scroll-rail" id="board-scroll-rail">
      <img class="rail-image" src="assets/scroll-rail-clean.png" alt="" draggable="false">
      <button type="button" class="board-scroll-end order-top" data-action="order-up" aria-label="Scroll orders up"></button>
      <div class="board-scroll-track" id="board-scroll-track"><img class="board-scroll-thumb" id="board-scroll-thumb" src="assets/scroll-thumb-clean.png" alt="" draggable="false" role="scrollbar" tabindex="0" aria-label="Order scroll position" aria-controls="order-scroller" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <button type="button" class="board-scroll-end order-bottom" data-action="order-down" aria-label="Scroll orders down"></button>
    </div>
    <footer class="board-utilities"><button class="board-footer" type="button" data-action="refresh">↻ New Orders</button><button class="board-footer odds" type="button" data-action="odds">Reward Odds</button></footer>
  </section>
  <div class="top-hud">
    <button id="wallet-button" class="picture-button wallet-btn" type="button" data-action="wallet" aria-label="View coins"><img src="assets/hud-coin-shell.png" alt="" draggable="false"><span class="wallet-count" id="wallet-value">12,750</span></button>
    <button id="help-button" class="picture-button" type="button" data-action="help" aria-label="Help"><img src="assets/button-help.png" alt="Help" draggable="false"></button>
    <button id="settings-button" class="picture-button" type="button" data-action="settings" aria-label="Settings"><img src="assets/button-settings.png" alt="Settings" draggable="false"></button>
  </div>
  <nav class="bottom-nav" aria-label="Bakery navigation">
    <button class="picture-button nav-packages" type="button" data-action="packages" aria-label="Packages"><img src="assets/nav-packages.png" alt="Packages" draggable="false"></button>
    <button class="picture-button nav-play" type="button" data-action="play" aria-label="Play Orders"><img src="assets/nav-play.png" alt="Play Orders" draggable="false"></button>
    <button class="picture-button nav-collection" type="button" data-action="collection" aria-label="Menu Collection"><img src="assets/nav-collection.png" alt="Menu Collection" draggable="false"></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-overlay" hidden>
    <div id="modal" role="dialog" aria-modal="true" aria-label="Bakery popup" tabindex="-1">
      <img class="modal-surface" src="assets/modal-frame-clean.png" alt="" draggable="false">
      <img id="modal-heading" src="assets/popup-heading.png" alt="" draggable="false">
      <h2 id="modal-title">Choose a Package</h2>
      <button id="modal-close" class="picture-button" type="button" data-action="close" aria-label="Close popup"><img src="assets/button-close.png" alt="Close" draggable="false"></button>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>
</main></div>
<script src="app.js"></script>
</body>
</html>
